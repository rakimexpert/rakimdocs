 name: type\n                      value: CREDITT\n                      type: query\n                      disabled: true\n                    - name: status\n                      value: NOT_REFUNDED\n                      type: query\n                      disabled: true\n                    - name: amount\n                      value: '1234567890123456'\n                      type: query\n                      disabled: true\n                    - name: brand\n                      value: viza\n                      type: query\n                      disabled: true\n                    - name: installments\n                      value: '13'\n                      type: query\n                      disabled: true\n                    - name: dateStart\n                      value: 12-01-2024\n                      type: query\n                      disabled: true\n                    - name: dateEnd\n                      value: 01-12-2024\n                      type: query\n                      disabled: true\n                response:\n                  status: .nan\n                  statusText: '500'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"error\": \"Server Error\"\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Nesta sess\xE3o vamos detalher a **API de Pagamentos** da plataforma.\n\n            Todas as requisi\xE7\xF5es realizadas na _API de Pagamentos_ exigem o m\xE9todo de [Autentica\xE7\xE3o de Pagamento (PayAuth)](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#462c2b70-7030-4123-9932-586913010790) e englobam o ecossistema de arranjo de pagamentos.\n\n            As funcionalidades s\xE3o:\n\n            A) Pr\xE9-autoriza\xE7\xE3o (tamb\xE9m chamada de _**Pr\xE9-Captura**_),\n\n            B) Autoriza\xE7\xE3o (tamb\xE9m chamada de _**Captura**_),\n\n            C) Cancelamento,\n\n            D) Split de pagamentos (quando uma transa\xE7\xE3o ser\xE1 liquidada para mais de 1 lojista)\n\n            Considere **Arranjo de Pagamentos** como uma sequ\xEAncia de procedimentos e valida\xE7\xF5es que uma transa\xE7\xE3o deve fazer para ser aprovada e liquidada para o lojista.\n\n            Acesse o link e veja entenda detalhadamente o processo: [<i><b>Casos de Uso<\/b><\/i>](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6);\n          type: text/markdown\n      - info:\n          name: Listar os Cart\xF5es do Cofre\n          type: folder\n          seq: 10\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA lista os tokens dos cart\xF5es no cofre para um determinado cliente. Consulte os cofres cadastrados por meio do documento enviado no endpoint de [Cria\xE7\xE3o do Cofre de Cart\xE3o](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#ae31bcae-6098-444b-a519-f29700a47e02).\n\n            ## Schemas\n\n            ### Parameters\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | documentNumber | string | N\xFAmero do documento do cliente. | Sim |  |\n          type: text/markdown\n        items:\n          - info:\n              name: Lista vault\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}payments/api/vaults/cards/:documentNumber'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: documentNumber\n                  value: ''\n                  type: path ante da cobran\xE7a. (Max 14 caracteres). | N\xE3o |  |\n              | `email` | string | Email de contato do pagante da cobran\xE7a. (Max 80 caracteres). | N\xE3o |  |\n              | `address` | Address | Informa\xE7\xF5es do pagante da cobran\xE7a. | N\xE3o |  |\n\n              ---\n\n              ### Address\n\n              | **Nome** | **Tipo** | **Descri\xE7\xE3o** | **Obrigatoriedade** | **Default** |\n              | --- | --- | --- | --- | --- |\n              | `zipCode` | string | CEP do logradouro. (Max 8 caracteres). | N\xE3o |  |\n              | `street` | string | Endere\xE7o do logradouro. (Max 255 caracteres). | N\xE3o |  |\n              | `city` | string | Cidade do logradouro. (Max 50 caracteres). | N\xE3o |  |\n              | `state` | string | Estado do logradouro, em formato de sigla. (Max 2 caracteres). | N\xE3o |  |\n              | `country` | string | Pa\xEDs do logradouro. (Max 3 caracteres). Defaults to BRA. | N\xE3o | BRA |\n\n              ---\n\n              ### Split\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | recipientToken | string | Token do Estabelecimento. | Sim |  |\n              | merchantType | string | Tipo de participante do pagamento. Valores poss\xEDveis (`PRIMARY`, `SECONDARY`). | Sim |  |\n              | chargeFee | boolean | Define se o participante \xE9 o pagador da taxa do pagamento. | Sim | `false` |\n              | type | string | Define a divis\xE3o do valor do split de maneira fixa ou percentual. Valores poss\xEDveis: (`PERCENTAGE` ou `AMOUNT`). | Sim |  |\n              | amountSplit | number | Valor do split destinado ao estabelecimento participante. Caso o tipo da divis\xE3o do valor do split for fixa \xE9 necess\xE1rio informar o campo em centavos, como amount. Exemplo: R$10,32 deve ser informado como 1032. Caso o tipo da divis\xE3o do valor do split for em porcentagem \xE9 necess\xE1rio informar o valor em                type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"amount\": [\n                          \"The amount field is required.\"\n                        ],\n                        \"returnReasonCode\": [\n                          \"The return reason code field is required.\"\n                        ]\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Essa \xE9 a sess\xE3o da documenta\xE7\xE3o destinada ao esclarecimento do escopo da API relacionado as cobran\xE7as banc\xE1rias por meio do Pix.\n\n            Com ela, \xE9 poss\xEDvel que voc\xEA gere **Pix Copia e Cola** e **Qr Code** para ser pago por um cliente ou usu\xE1rio de sua plataforma.\n          type: text/markdown\n  - info:\n      name: Rakim Expert - Global API's\n      type: folder\n      seq: 1\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        O objetivo desta documenta\xE7\xE3o \xE9 orientar o desenvolvedor sobre as especifica\xE7\xF5es das API's, descrevendo funcionalidades e m\xE9todos, listando informa\xE7\xF5es que devem ser enviadas e recebidas nas requisi\xE7\xF5es como tamb\xE9m provendo exemplos.\n\n        Nesse manual voc\xEA encontrar\xE1 refer\xEAncias sobre todas as opera\xE7\xF5es dispon\xEDveis na _**API REST**_.\n\n        As requisi\xE7\xF5es podem ser utilizadas por meio da chave espec\xEDfica de integra\xE7\xE3o de sua loja ou atrav\xE9s da chave de sess\xE3o gerada pela autentica\xE7\xE3o de seu estabelecimento. Para saber mais informa\xE7\xF5es a respeito da autentica\xE7\xE3o, leia: [Introdu\xE7\xE3o a autentica\xE7\xE3o](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#462c2b70-7030-4123-9932-586913010790).\n\n        Cada ambiente abaixo tem sua autentica\xE7\xE3o via _**TOKEM DE AUTENTICA\xC7\xC3O**_ espec\xEDfico.\n\n        |  |  |\n        | --- | --- |\n        | {{URL_SANDBOX}} | Homologa\xE7\xE3o |\n        | {{URL_PRODUCTION}} | Produ\xE7\xE3o |\n      type: text/markdown\n  - info:\n      name: Recorr\xEAncia\n      type: folder\n      seq: 6\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Criar Link de Recorr\xEAncia\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: Esse \xE9 o endpoint destinado a cria\xE7\xE3o de um link de recorr\xEAncia contendo um checkout para ser pago por um participante da recorr\xEAncia.\n          type: text/markdown\n        items:\n          - info:\n              name: Criar link\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/recurrences/create'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/recurrences/create'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"amount\": 1035,\n                        \"typeCharge\": 1,\n                        \"customer\": {\n                          \"name\": \"Comprador Teste\",\n                          \"email\": \"example@test.com\",\n                          \"mobile\": \"11999999999\",\n                          \"birthDate\": \"1969-12-31\",\n                          \"documentNumber\": \"99999999999\",\n                          \"address\": {\n                            \"zipcode\": \"99999999\",\n                            \"street\": \"Rua teste\",\n                            \"number\": \"1\",\n                            \"district\": \"Bairro teste\",\n                            \"complement\": \"Complemento teste\",\n                            \"city\": \"S\xE3o Paulo\",\n                            \"state\": \"SP\",\n                            \"country\": \"BRA\"\n                          }\n                        }\n                      }\n                response:\n                  status: 200\n                  statusText: OK\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"id\": \"29857396-2d61-4258-9758-2066edc1b897\",\n                        \"paymentUrl\": \"https://app-sandbox.u2pay.com.br/checkout/c8794b9c-5756-4e76-9d59-a0de341a5c30\",\n                        \"type\": \"recurrences\",\n                        \"amount\": 1035,\n                        \"typeCharge\": 1,\n                        \"totalCharges\": 0,\n                        \"lastPaymentDay\": \"\",\n                        \"maxNumberOfInstallments\": 1,\n                        \"currency\": \"BRL\",\n o n\xFAmero do pedido. | N\xE3o | \\- |\n            | **typeCharge** | int32 | Tipo de recorr\xEAncia relacionada. Valores poss\xEDveis:  <br>1 - Cobrar para sempre  <br>2 - Cobrar at\xE9 uma data  <br>3 - Cobrar N\xBA parcelas | Sim | \\- |\n            | **totalCharges** | int32 | N\xFAmero de cobran\xE7as a realizar. Obrigat\xF3rio quando o tipo de recorr\xEAncia enviado for cobran\xE7a por N\xBA parcelas. | N\xE3o | \\- |\n            | **finalDate** | date | Data do \xFAltimo pagamento a ser realizado. Obrigat\xF3rio quando o tipo de recorr\xEAncia for at\xE9 uma data. | N\xE3o | \\- |\n            | **payment** | Payment | Informa\xE7\xF5es do pagamento de recorr\xEAncia. | Sim | \\- |\n            | **customer** | Customer | Informa\xE7\xF5es do participante da recorr\xEAncia. | Sim | \\- |\n\n            ### Payment\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **type** | string | M\xE9todo de pagamento. Valores poss\xEDveis: `credit`. | Sim | \\- |\n            | **softdescriptor** | string | Texto exibido na fatura do cart\xE3o do comprador. | N\xE3o | \\- |\n            | **currency_code** | string | Moeda na qual o pagamento ser\xE1 realizado. Valores poss\xEDveis: `BRL`. | N\xE3o | BRL |\n\n            ### Customer\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **name** | string | Nome do cliente participante da recorr\xEAncia. | Sim | \\- |\n            | **document** | string | N\xFAmero de documento do participante. | N\xE3o | \\- |\n            | **email** | string | Email do participante. | N\xE3o | \\- |\n            | **phone** | string | Celular do participante. | N\xE3o | \\- |\n            | **birthdate** | date | Data de nascimento do participante. | N\xE3o | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Criar Recorr\xE 2024\",\n                            \"cvv\": \"123\",\n                            \"brand\": \"mastercard\"\n                          }\n                        },\n                        \"customer\": {\n                          \"document\": \"99999999999\",\n                          \"phone\": \"11999999999\",\n                          \"birthdate\": \"1969-12-31\",\n                          \"billing_address\": {\n                            \"zipcode\": \"99999999\",\n                            \"street\": \"Rua teste\",\n                            \"number\": \"1\",\n                            \"district\": \"Bairro teste\",\n                            \"complement\": \"Complemento teste\",\n                            \"city\": \"S\xE3o Paulo\",\n                            \"state\": \"SP\",\n                            \"country\": \"BRA\"\n                          }\n                        }\n                      }\n                response:\n                  status: 200\n                  statusText: OK\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"amount\": [\n                          \"The amount field is required.\"\n                        ],\n                        \"typeCharge\": [\n                          \"The type charge field is required.\"\n                        ],\n                        \"customer.name\": [\n                          \"The customer.name field is required.\"\n                        ],\n                        \"customer.email\": [\n                          \"The customer.email field is required.\"\n                        ]\n                      }\n              - name: Requisi\xE7\xE3o Inv\xE1lida\n                request:\n                  url: '{{URL}}payments/api/sales/subscriptions'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"totalCharges\": 12,\n                        \"payment\": {\n                          \"type\": \"credit\",\n                          \"softdescriptor\": \"PAG*TESTE\",\n                          \"card\": {\n                            \"holder\": \"TESTE HOLDER\",\n                            \"number\": \"5201561050025011\",\n                            \"expiry_month\": \"09\",\n                            \"expiry_year\": \"2024\",\n                            \"cvv\": \"123\",\n                            \"brand\": \"mastercard\"\n                          }\n                        },\n                        \"customer\": {\n                          \"document\": \"99999999999\",\n                          \"phone\": \"11999999999\",\n                          \"birthdate\": \"1969-12-31\",\n                          \"billing_address\": {\n                            \"zipcode\": \"99999999\",\n                            \"street\": \"Rua teste\",\n                            \"number\": \"1\",\n                            \"district\": \"Bairro teste\",\n                            \"complement\": \"Complemento teste\",\n                            \"city\": \"S\xE3o Paulo\",\n                            \"state\": \"SP\",\n                            \"country\": \"BRA\"\n                          }\n                        }\n                      }\n                response:\n                  status: 200\n                  statusText: OK\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"status\": 3,\n                          \"returnCode\": \"0\",\n                          \"returnMessage\": \"Sucesso\",\n                          \"message\": \"Transa\xE7\xE3o autorizada com sucesso.\",\n                          \"paymentId\": \"010000003811041456460000064215020000000000\",\n                          \"authorizationCode\": \"007019\",\n                          \"orderNumber\": \"6183f4ac7ad8d\",\n                          \"type\": \"credit\",\n                          \"installments\": 1,\n                          \"brand\": \"mastercard\",\n                          \"amount\": 1035,\n                          \"fees\": 86,\n                          \"liquid\": 949,\n                          \"acquirer\": \"adiq\",\n                          \"createdAt\": \"2021-11-04 11:56:50\",\n                          \"first4Digits\": \"5201\",\n                          \"last4Digits\": \"5011\",\n                          \"nsu\": \"61a7d95711f57\",\n                          \"nextRecurrency\": \"2022-09-02\",\n                          \"recurrentPaymentId\": \"8586788b-5fd3-4bcb-a38b-1051dbf952b1\",\n                          \"customer\": {\n                              \"name\": \"Comprador Teste\",\n                              \"document\": \"99999999999\",\n                              \"email\": \"example@test.com\",\n                              \"phone\": \"11999999999\",\n                              \"birthDate\": \"1969-12-31\",\n                              \"billingAddress\": {\n                                  \"street\": \"Rua teste\",\n                                  \"number\": \"1\",\n                                  \"district\": \"Bairro teste\",\n                                  \"complement\": \"Complemento teste\",\n                                  \"zipcode\": \"99999999\",\n                                  \"city\": \"S\xE3o Paulo\",\n                                  \"state\": \"SP\",\n                                  \"country\": \"BRA\"\n                              }\n                          }\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Essa \xE9 a sess\xE3o de introdu\xE7\xE3o do escopo de API relacionado as recorr\xEAncias presentes na plataforma. Com ela \xE9 poss\xEDvel que voc\xEA crie cobran\xE7as de planos mensais (recorrentes) para usu\xE1rios de sua plataforma por meio do endpoint de [Cria\xE7\xE3o de Recorr\xEAncia](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#f5bcfd0f-c1af-4a91-8209-60922e43cbde) ou pelo endpoint de [Cria\xE7\xE3o de Link de Recorr\xEAncia](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#52571b3c-fd30-41f2-bc25-d3a10cde2e4f).\n\n            Geralmente, plataformas de planos, mensalidades e assinaturas utilizam esse modelo de aprova\xE7\xE3o de pagamento, na qual o primeiro pagamento \xE9 realizado pelo comprador e os demais s\xE3o realizados e autorizados automaticamente de acordo com o fluxo/modalidade escolhida pelo estabelecimento. Veja a seguir modalidades de recorr\xEAncia suportados por nossa plataforma.\n\n            ## Recorr\xEAncia Padr\xE3o\n\n            Essa \xE9 a modalidade de recorr\xEAncia, na qual a recorr\xEAncia acontece e \xE9 aplicada at\xE9 o momento do cancelamento dessa recorr\xEAncia, ou seja, ela ir\xE1 acontecer at\xE9 o tempo que for necess\xE1rio desde que o cliente ou estabelecimento n\xE3o cancele a recorr\xEAncia em um dado momento.\n\n            ## Recorr\xEAncia at\xE9 uma data\n\n            Essa \xE9 a modalidade de recorr\xEAncia, na qual a recorr\xEAncia acontece at\xE9 uma data limite ser excedida. Geralmente, s\xE3o recorr\xEAncias utilizadas por plataforma que apresentam licen\xE7as de utiliza\xE7\xE3o de um servi\xE7o at\xE9 um momento atrav\xE9s de um pagamento mensal.\n\n            ## Recorr\xEAncia at\xE9 N\xBA parcelas\n\n            Essa \xE9 uma modalidade, na qual a recorr\xEAncia acontece at\xE9 um n\xFAmero **n de vezes**, ou seja, enquanto aquela quantidade n estabelecida n\xE3o ser superada, a recorr\xEAncia continuar\xE1 aprovando e autoriza\xE7\xE3o pagamentos automaticamente.\n          type: text/markdown\n  - info:\n      name: Status\n      type: folder\n      seq: 11\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Status de Pagamento\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Os pagamentos podem ter diferentes status ao longo do processo. Os status abaixo s\xE3o aplic\xE1veis tanto para transa\xE7\xF5es via **PIX** quanto **Cart\xE3o de Cr\xE9dito**:\n\n            | C\xF3digo | Status de Transa\xE7\xE3o | Meios de Pagamento | Descri\xE7\xE3o |\n            | --- | --- | --- | --- |\n            | **1** | Pendente | Cart\xE3o de cr\xE9dito e Pix | Pagamento est\xE1 aguardando uma a\xE7\xE3o por parte do pagador.  <br>\\- `PIX`: A transa\xE7\xE3o foi gerada e est\xE1 aguardando o cliente efetuar o pagamento.  <br>\\- `Cart\xE3o de Cr\xE9dito`: O valor foi reservado no cart\xE3o do portador, mas a captura ainda precisa ser realizada. A captura garante o dep\xF3sito do valor na conta e, por padr\xE3o, pode ser efetuada at\xE9 7 dias ap\xF3s a autoriza\xE7\xE3o. |\n            | **2** | Cancelado | Cart\xE3o de cr\xE9dito e Pix | Pagamento cancelado.  <br>\\- `PIX`: Pagamento foi cancelado porque o cliente n\xE3o realizou o pagamento dentro do prazo e o QR Code expirou.  <br>\\- `Cart\xE3o de Cr\xE9dito`: Pagamento cancelado pela loja no mesmo dia ou n\xE3o realizou a captura dentro do prazo. |\n            | **3** | Pago | Cart\xE3o de cr\xE9dito e Pix | Pagamento confirmado e aprovado. |\n            | **4** | Aguardando reembolso | Cart\xE3o de cr\xE9dito | Pagamento aguardando reembolso. |\n            | **5** | Em processamento | Cart\xE3o de cr\xE9dito | Processando o pagamento. |\n            | **6** | Reembolsado | Cart\xE3o de cr\xE9dito e Pix | Pagamento foi reembolsado. |\n            | **7** | Negado | Cart\xE3o de cr\xE9dito | Pagamento n\xE3o autorizado pelo respons\xE1vel do meio de pagamento. |\n            | **8** | Chargeback | Cart\xE3o de cr\xE9dito | Pagamento foi estornado pela institui\xE7\xE3o financeira devido a uma contesta\xE7\xE3o feita pelo portador do cart\xE3o ou cliente. |\n            | **9** | Split manual | Cart\xE3o de cr\xE9dito | Pagamento aguardando divis\xE3o dos valores entre os recebedores. |\n            | **10** | Fraude | Cart\xE3o de cr\xE9dito | Pagamento marcado para an\xE1lise manual por suspeita de fraude. |\n            | **11** | MED (Mecanismo Especial de Devolu\xE7\xE3o do PIX) | Pix | Pagamento ocorreu um Mecanismo Especial de Devolu\xE7\xE3o (MED), utilizado quando o cliente contesta uma transa\xE7\xE3o fraudulenta ou realizada indevidamente. |\n          type: text/markdown\n  - info:\n      name: Webhook's\n      type: folder\n      seq: 10\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Cadastrar Webhook\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esse \xE9 o endpoint destinado ao cadastro de URL para ser notificado os pagamentos e as cobran\xE7as pix **de cada estabelecimento**. Dessa forma, \xE9 necess\xE1rio que voc\xEA cadastre e configure o webhook para cada estabelecimento.\n\n            ## Body Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | url | string | URL na qual o webhook ser\xE1 enviado. | Sim |  |\n            | apiAccessKey | string | Opcional. Cadastrar uma chave de seguran\xE7a para autenticar e validar a assinatura enviada na webhook no header Api-Access-Key. | N\xE3o |  |\n          type: text/markdown\n        items:\n          - info:\n              name: Cadastrar Webhook\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/notifications/webhooks'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              body:\n                type: json\n                data: |-\n                  {\n                      \n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/notifications/webhooks'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"status\": \"success\",\n                          \"url\": \"https://api.u2pay.com.br/app/api/notifications/webhooks\",\n                          \"apiAccessKey\": \"d14a028c2a3a2bc9476102bb288234c415a2b01f828ea62ac5b3e42f\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}app/api/notifications/webhooks'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n              - name: Requisi\xE7\xE3o Inv\xE1lida\n                request:\n                  url: '{{URL}}app/api/notifications/webhooks'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '422'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": [\n                          \"The url field is required.\"\n                        ]\n                      }\n      - info:\n          name: Reenvio de Webhook de Estabelecimento\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: |\n            Este \xE9 o endpoint destinado \xE0 solicita\xE7\xE3o de reenvio da webhook relacionada a um estabelecimento.\n          type: text/markdown\n        items:\n          - info:\n              name: Reenvio de Webhook de Estabelecimento\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/payments/api/notifications/webhooks/companies/retry'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/companies/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Webhook sent\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/companies/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n              - name: Requisi\xE7\xE3o Inv\xE1lida\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/companies/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '500'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"error\": \"Server Error\"\n                      }\n      - info:\n          name: Exemplo de Webhook\n          type: folder\n          seq: 4\n        request:\n          auth: inherit\n        docs:\n          content: |-\n\n            Essa \xE9 a sess\xE3o da documenta\xE7\xE3o destinada a exemplifica\xE7\xE3o da webhook enviada para URL cadastrada pelo lojista variando de acordo com o tipo de notifica\xE7\xE3o.\n\n            ## Notifica\xE7\xE3o de Pagamento\n\n            A Notifica\xE7\xE3o de Pagamento \xE9 enviada atrav\xE9s dos par\xE2metros apresentados a seguir:\n\n            ```json Exemplo de Requisi\xE7\xE3o\n            {\n              \"event\": \"PAYMENT.REFUNDED\",\n              \"data\": {\n                \"id\": \"020000026803231938500000065382450000000000\",\n                \"paymentLinkId\": \"b566309d-a420-4ff9-be44-a32a374c07f1\",\n                \"status\": 7,\n                \"returnCode\": \"FF\",\n                \"returnMessage\": \"Sucesso\",\n                \"authorizationCode\": \"006734\",\n                \"orderNumber\": \"623b774a48472\",\n                \"nsu\": \"623b775052d0e\",\n                \"transactionType\": \"credit\",\n                \"installments\": \"12\",\n                \"brand\": \"mastercard\",\n                \"amount\": 452200,\n                \"fees\": 15539,\n                \"liquid\": 0,\n                \"refunds\": 436661,\n                \"acquirer\": \"adiq\",\n                \"createdAt\": \"2022-03-23 16:38:56\",\n                \"updatedAt\": \"2022-06-20 10:45:47\",\n                \"account\": {\n                  \"id\": \"8284b41c0c234b0f889b087a451de9420f2664fc\",\n                  \"name\": \"Sueli e Breno Cont\xE1bil Ltda\"\n                },\n                \"events\": [\n                  {\n                    \"createdAt\": \"2022-06-20 10:45:47\",\n                    \"type\": \"PAYMENT.REFUNDED\"\n                  },\n                  {\n                    \"createdAt\": \"2022-03-23 16:38:56\",\n                    \"type\": \"PAYMENT.AUTHORIZED\"\n                  },\n                  {\n                    \"createdAt\": \"2022-03-23 16:38:56\",\n                    \"type\": \"PAYMENT.CREATED\"\n                  }\n                ]\n              }\n            }\n            ```\n\n            Sendo o par\xE2metro `event` destinado ao tipo de evento associado a notifica\xE7\xE3o. Veja a seguir a lista dos eventos associados a notifica\xE7\xE3o:\n\n            | Evento                        | Descri\xE7\xE3o                                                                          |\n            | ----------------------------- | ---------------------------------------------------------------------------------- |\n            | **PAYMENT.CREATED**           | Primeiro evento de um pagamento, indica que o pagamento foi criado.                |\n            | **PAYMENT.PRE_AUTHORIZED**    | Esse status indica a reserva do valor do pagamento no cart\xE3o do cliente.           |\n            | **PAYMENT.AUTHORIZED**        | Significa que o pagamento foicapturado e debitado do cart\xE3o do cliente.            |\n            | **PAYMENT.NOT_AUTHORIZED**    | Significa que o pagamento criado foi negado e n\xE3o pode ser aprovado.               |\n            | **PAYMENT.CANCELLED**         | Significa que o pagamento foi cancelado.                                           |\n            | **PAYMENT.REFUNDED**          | Significa que o pagamento foi reembolsado.                                         |\n            | **PAYMENT.REFUNDED_REJECTED** | Significa que a solicita\xE7\xE3o de reembolso do pagamento foi negado.                  |\n            | **PAYMENT.REFUNDED_WAITING**  | Significa que a solicita\xE7\xE3o de reembolso de pagamento ainda est\xE1 sendo processada. |\n            | **PAYMENT.REVERSED**          | Signifca que o pagamento foi estornado por chargeback.                             |\n            | **PAYMENT_MED**               | Signifca que o pagamento sofreu MED (Mecanismo Especial de Devolu\xE7\xE3o do PIX)       |\n\n            Esteja atento a cada evento e mapeie corretamente conforme a descri\xE7\xE3o de seu significado.\n\n            ## Notifica\xE7\xE3o de Estabelecimento\n\n            A notifica\xE7\xE3o de mudan\xE7a de status do estabelecimento \xE9 evniado conforme os par\xE2metros a seguir:\n\n            ```json Exemplo de Requisi\xE7\xE3o\n            {\n              \"event\": \"COMPANY.ACTIVE\",\n              \"data\": {\n                \"companyId\": 1,\n                \"mccId\": 208,\n                \"companyName\": \"Bruno E Ana Consultoria Financeira Me\",\n                \"socialReason\": \"Bruno E Ana Consultoria Financeira Me\",\n                \"type\": \"2\",\n                \"documentNumber\": \"80017668000180\",\n                \"softDescriptor\": null,\n                \"siteUrl\": null,\n                \"accessToken\": \"7612adf805f3408786d9181474977fd607149331\",\n                \"active\": \"A\"\n              }\n            }\n            ```\n\n            Sendo o par\xE2metro `event` destinado ao tipo de evento associado a notifica\xE7\xE3o. Veja a seguir a lista dos eventos associados a notifica\xE7\xE3o de estabelecimento:\n\n            | Evento               | Descri\xE7\xE3o                                        |\n            | -------------------- | ------------------------------------------------ |\n            | **COMPANY.ACTIVE**   | Significa que o Estabelecimento foi ativado.     |\n            | **COMPANY.DELETED**  | Significa que o Estabelecimento foi deletado.    |\n            | **COMPANY.INACTIVE** | Significa que o Estabelecimento foi inativado.   |\n            | **COMPANY.WAITING**  | Significa que o Estabelecimento est\xE1 em an\xE1lise. |\n            | **COMPANY.REJECTED** | Significa que o Estabelecimento foi rejeitado.   |\n\n            Esteja atento a cada evento e mapeie corretamente conforme a descri\xE7\xE3o de seu significado.\n          type: text/markdown\n      - info:\n          name: Reenvio de Webhook de Pagamento\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esse \xE9 o endpoint destinado a solicita\xE7\xE3o de reenvio da webhook relacionado a um pagamento.\n\n            ## Body Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | paymentId | string | ID identificador do pagamento. | Sim |  |\n          type: text/markdown\n        items:\n          - info:\n              name: Reenvio de Webhook de Pagamento\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/payments/api/notifications/webhooks/:paymentId/retry'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: paymentId\n                  value: ''\n                  type: path\n              body:\n                type: json\n                data: |-\n                  {\n                      \n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/:paymentId/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: paymentId\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Webhook sent\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/:paymentId/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: paymentId\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"url\": \"string\",\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n              - name: Requisi\xE7\xE3o Inv\xE1lida\n                request:\n                  url: '{{URL}}payments/api/notifications/webhooks/:paymentId/retry'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: paymentId\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"apiAccessKey\": \"string\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Payment not found\"\n                      }\ndocs:\n  content: |-\n    Bem vindo \xE0 documentac\xE3o de API's da Rakim Expert.\n\n    Aqui os desenvolvedores poder\xE3o estudar e adaptar diferentes formas de modelos de neg\xF3cios para suas plataformas.\n\n    Somos uma sub-Adquirente homologada a operar com as principais bandeiras e com Pix\n\n    Qualquer d\xFAvida envie email para: [SUPORTE@RAKIM.COM.BR](https://mailto:SUPORTE@RAKIM.COM.BR)\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-01-29T01:46:18.834Z'\n    exportedUsing: Bruno/3.0.2\n";
