ame: Saque\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Endpoint para solicitar saque do saldo livre no banco digital.\n\n            - Voc\xEA pode cadastrar uma webhook s\xF3 para receber a confirma\xE7\xE3o do saque, caso n\xE3o seja enviado, a unica forma de confirma\xE7\xE3o ser\xE1 visualizar no painel, link EXTRATO BANC\xC1RIO.\n                \n            - Caso voc\xEA n\xE3o envie e chave pix na requisi\xE7\xE3o, utilizaremos a chave cadastrada da loja no momento do onboarding.\n                \n\n            ## Par\xE2metros do Objeto\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **amount** | number | xx.xx | sim | \\- |\n            | **pixKey** | string | s\xF3 aceitamos chave aleat\xF3ria do pix | n\xE3o | \\- |\n            | webHookURL | string | webhook para receber o retorno do saque | n\xE3o | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Solicitar Saque\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/bank/withdraw'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              body:\n                type: json\n                data: |-\n                  {\n                      \"amount\":12.34,\n                      \"pixKey\":\"dc7a478j-196l-03fm-t6gh-4298er7845m2\",\n                      \"webHookURL\":\"https://minhaURL.com.br/callback\"\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/bank/withdraw'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"amount\":12.34,\n                          \"pixKey\":\"dc7a478j-196l-03fm-t6gh-4298er7845m2\",\n                          \"webHookURL\":\"https://minhaURL.com.br/callback\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"message\": \"Seu saque esta em processamento, aguarde\", \"Status\": \"Pendente\"\n                      }\n              - name: Requisi\xE7\xE3o Inv\xE1lida\n                request:\n                  url: '{{URL}}app/api/bank/withdraw'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"amount\":12.34,\n                          \"pixKey\":\"dc7a478j-196l-03fm-t6gh-4298er7845m2\",\n                          \"webHookURL\":\"https://minhaURL.com.br/callback\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '422'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"message\": \"saldo insulficiente\"\n                      }\n  - info:\n      name: Outros\n      type: folder\n      seq: 12\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Processo de Homologa\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Essa \xE9 a sess\xE3o da documenta\xE7\xE3o destinada ao esclarecimento de como funciona o processo de homologa\xE7\xE3o dentro da nossa plataforma.\n\n            Antes de tudo, vale-se dizer que o Processo de Homologa\xE7\xE3o \xE9 um **evento posterior** ao processo de valida\xE7\xE3o dos dados cadastrais da empresa e estabelecimento de rela\xE7\xE3o comercial entre as partes.\n\n            Vale ressaltar, que esse processo \xE9 importante para o **alinhamento** e **interoperabilidade** entre os sistemas envolvidos, sendo necess\xE1rio, a valida\xE7\xE3o de alguns processos em ambiente de testes para aceita\xE7\xE3o e homologa\xE7\xE3o do sistema cliente em ambiente de produ\xE7\xE3o **independentemente do tipo de opera\xE7\xE3o envolvida**.\n\n            Assim, para dar-se in\xEDcio ao processo de homologa\xE7\xE3o \xE9 necess\xE1rio a [Cria\xE7\xE3o de Conta em Ambiente de Homologa\xE7\xE3o](https://api-sandbox.rakim.com.br), sendo v\xE1lido dizer que as informa\xE7\xF5es contidas nesse ambiente s\xE3o apartadas das presentes em ambiente de produ\xE7\xE3o. Ent\xE3o, a **chave de integra\xE7\xE3o**, **credenciais de acesso** n\xE3o s\xE3o as mesmas presente em ambiente real de utiliza\xE7\xE3o.\n\n            Ap\xF3s, a cria\xE7\xE3o de sua conta \xE9 necess\xE1rio que nosso time interno **aprove a cria\xE7\xE3o da sua loja** e **habilite a chave de integra\xE7\xE3o** para sua visualiza\xE7\xE3o. Para isso, entre em contato com o time interno na qual foi estabelecido comunica\xE7\xE3o atrav\xE9s do time comercial e pe\xE7a a aprova\xE7\xE3o da sua loja para que voc\xEA consiga visualizar sua chave de integra\xE7\xE3o. [Clique aqui](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#462c2b70-7030-4123-9932-586913010790) para obter mais informa\xE7\xF5es.\n\n            Com a **chave de integra\xE7\xE3o** e **loja habilitada** voc\xEA consegue usufruir das funcionalidades para a realiza\xE7\xE3o dos testes abaixo (utilize os [Cart\xF5es de Teste](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#91012dcc-4ed4-4c89-bdb1-8a6508e3138c) para isso):\n\n            | Testes Necess\xE1rio | Retorno | Obrigat\xF3rio |\n            | --- | --- | --- |\n            | Crie um **pagamento de captura n\xE3o parcelado**. | Autoriza\xE7\xE3o Bem Sucedida | Sim |\n            | Crie um **pagamento de captura parcelado em n vezes**. | Autoriza\xE7\xE3o Bem Sucedida | Sim |\n            | Crie um **pagamento de pr\xE9-captura** e depois capture-o. | Autoriza\xE7\xE3o Bem Sucedida | Opcional. |\n            | Crie um **pagamento de captura negado** com motivo conforme demonstrado no retorno. | Autoriza\xE7\xE3o Negada por Cart\xE3o Expirado. | Sim |\n            | Crie um **pagamento de captura negado** com motivo conforme demonstrado no retorno. | Autoriza\xE7\xE3o Negada por Cart\xE3o Cancelado. | Sim |\n            | Crie um **pagamento de captura negado** com motivo conforme demonstrado no retorno. | Autoriza\xE7\xE3o Negada por Cart\xE3o Bloqueado. | Sim |\n            | Crie um **pagamento de captura negado** com motivo conforme demonstrado no retorno. | Autoriza\xE7\xE3o N\xE3o Autorizada. | Sim |\n            | Crie um **pagamento aprovado** e ap\xF3s isso **cancele-o**. | Cancelamento realizado com sucesso. | Opcional. |\n            | Crie um **pix** e depois receba via webhook a **aprova\xE7\xE3o do mesmo**. | Pago. | Opcional. |\n\n            Se atente em utilizar os cart\xF5es de testes e realizar os testes adequadamente. Posteriormente a realiza\xE7\xE3o desse processo **solicite ao time interno de suporte** a homologa\xE7\xE3o da sua empresa para cadastro no **ambiente de produ\xE7\xE3o**. Ap\xF3s o cadastro realizado, voc\xEA poder\xE1 usufruir de todo o ecossistema da plataforma em ambiente real e ideal para seu neg\xF3cio.\n          type: text/markdown\n  - info:\n      name: Pagamentos\n      type: folder\n      seq: 3\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Ativando um Split Tardio\n          type: folder\n          seq: 7\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA ativa os recebedores do _**Split Tardio**_, (tamb\xE9m chamada de _Defini\xE7\xE3o dos Recebedores_ ou _Participantes da Liquida\xE7\xE3o da transa\xE7\xE3o_). Voc\xEA pode obter mais informa\xE7\xF5es, [clicando aqui](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6).\n\n            ### PaymentRequest\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | orderId | string | ID identificador do pedido. | Sim |  |\n            | splits | Split\\[\\] | Lista de divis\xF5es do pagamento. | Sim |  |\n\n            ---\n\n            ### Split\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | recipientToken | string | Token do Estabelecimento. | Sim |  |\n            | merchantType | string | Tipo de participante do pagamento. Valores poss\xEDveis (`PRIMARY`, `SECONDARY`). | Sim |  |\n            | chargeFee | boolean | Define se o participante \xE9 o pagador da taxa do pagamento. | Sim | `false` |\n            | type | string | Define a divis\xE3o do valor do split de maneira fixa ou percentual. Valores poss\xEDveis: (`PERCENTAGE` ou `AMOUNT`). | Sim |  |\n            | amountSplit | number | Valor do split destinado ao estabelecimento participante. Caso o tipo da divis\xE3o do valor do split for fixa \xE9 necess\xE1rio informar o campo em centavos, como amount. Exemplo: R$10,32 deve ser informado como 1032. Caso o tipo da divis\xE3o do valor do split for em porcentagem \xE9 necess\xE1rio informar o valor em percentual de 0 a 100. Exemplo: 37% deve ser informado como 3700. | Sim |  |\n            | discountGrossAmount | boolean | Define se o c\xE1lculo da taxa cobrada pela plataforma de pagamento \xE9 sobre o valor l\xEDquido ou valor bruto. Valores poss\xEDveis  <br>  <br>VALOR L\xCDQUIDO - false  <br>VALOR BRUTO - true | N\xE3o | `false` |\n          type: text/markdown\n        items:\n          - info:\n              name: Split tardio\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}payments/api/sales/splits/delayed/:paymentId'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: paymentId\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              ## Schemas\n\n              ### Parameters\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | paymentId | string | Identificador \xFAnico do pagamento. | Sim |  |\n            examples:\n              - name: Sucesso\n                request:\n                  url: https://api.rakim.com.br/app/payments/api/sales/:paymentId/cancel\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"orderId\": \"6183f4ac7ad8d\",\n                        \"splits\": [\n                          {\n                            \"recipientToken\": \"9b7ba208a0e54094b9c06ef479acf4b29ddc1d3a\",\n                            \"merchantType\": \"PRIMARY\",\n                            \"chargeFee\": true,\n                            \"type\": \"PERCENTAGE\",\n                            \"amountSplit\": 6000\n                          },\n                          {\n                            \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 4000\n                          },\n                          {\n                            \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d633\",\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"AMOUNT\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 200\n                          }\n                        ]\n                      }\n                      '\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"receivers\": [\n                          {\n                            \"account\": {\n                              \"id\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                              \"name\": \"C\xE9sar E Ros\xE2ngela Constru\xE7\xF5es Me\"\n                            },\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"AMOUNT\",\n                            \"amount\": {\n                              \"total\": 200,\n                              \"fees\": 0,\n                              \"liquid\": 200\n                            },\n                            \"chargeFee\": \"false\"\n                          },\n                          {\n                            \"account\": {\n                              \"id\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                              \"name\": \"C\xE9sar E Ros\xE2ngela Constru\xE7\xF5es Me\"\n                            },\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"amount\": {\n                              \"total\": 380,\n                              \"fees\": 0,\n                              \"liquid\": 380\n                            },\n                            \"chargeFee\": \"false\"\n                          },\n                          {\n                            \"account\": {\n                              \"id\": \"9b7ba208a0e54094b9c06ef479acf4b29ddc1d3a\",\n                              \"name\": \"Antonio e Mariana Financeira Ltda\"\n                            },\n                            \"merchantType\": \"PRIMARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"amount\": {\n                              \"total\": 1035,\n                              \"fees\": 666,\n                              \"li ,\n                            \"type\": \"PERCENTAGE\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 4000\n                          },\n                          {\n                            \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d633\",\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"AMOUNT\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 200\n                          }\n                        ]\n                      }\n                      '\n                response:\n                  status: .nan\n                  statusText: '422'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"code\": \"string\",\n                        \"message\": \"string\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/cancel'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"orderId\": \"6183f4ac7ad8d\",\n                        \"splits\": [\n                          {\n                            \"recipientToken\": \"9b7ba208a0e54094b9c06ef479acf4b29ddc1d3a\",\n                            \"merchantType\": \"PRIMARY\",\n                            \"chargeFee\": true,\n                            \"type\": \"PERCENTAGE\",\n                            \"amountSplit\": 6000\n                          },\n                          {\n                            \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 4000\n                          },\n                          {\n                            \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d633\",\n                            \"merchantType\": \"SECONDARY\",\n                            \"type\": \"AMOUNT\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 200\n                          }\n                        ]\n                      }\n                      '\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Cancelando um Pagamento\n          type: folder\n          seq: 5\n        request:\n          auth: inherit\n        docs:\n          content: Esse \xE9 o endpoint destinado ao cancelamento de pagamento pr\xE9-autorizado ou autorizado.\n          type: text/markdown\n        items:\n          - info:\n              name: cancel\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}payments/api/sales/:paymentId/cancel'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: paymentId\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              ## Schemas\n\n              ### Parameters\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | paymentId | string | Identificador \xFAnico do pagamento. | Sim |  |\n            examples:\n              - name: Sucesso\n                request:\n                  url: https://api.rakim.com.br/app/payments/api/sales/:paymentId/cancel\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"status\": 7,\n                        \"returnCode\": \"FF\",\n                        \"returnMessage\": \"Sucesso\",\n                        \"paymentId\": \"010000003811041456460000064215020000000000\",\n                        \"authorizationCode\": \"\",\n                        \"amount\": 3990,\n                        \"fees\": 260,\n                        \"liquid\": 3730,\n                        \"acquirer\": \"adiq\",\n                        \"releaseAt\": \"2021-11-04 12:35:47\"\n                      }\n              - name: Falha na Requisi\xE7\xE3o\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/cancel'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                response:\n                  status: 200\n                  statusText: '400'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"code\": \"__general__\",\n                        \"message\": \"Transa\xE7\xE3o capturada.\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/cancel'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Capturando um Pagamento Pr\xE9-Autorizado\n          type: folder\n          seq: 4\n        request:\n          auth: inherit\n        docs:\n          content: Este endpoint \xE9 destinado a capturar um pagamento criado como pr\xE9-autorizado anteriormente. Para saber mais informa\xE7\xF5es a respeito, [clique aqui](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6).\n          type: text/markdown\n        items:\n          - info:\n              name: capture\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}payments/api/sales/:paymentId/capture'\n              params:\n                - name: paymentId\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |\n              ## Schemas\n\n              ### PaymentRequest\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | amount | string | Valor a ser capturado do pagamento pr\xE9-autorizado em centavos sem v\xEDrgula e ponto. | Sim |  |\n\n\n              ---\n\n              ### Parameters\n\n              | Nome       | Tipo   | Descri\xE7\xE3o                                | Required | Default |\n              |------------|--------|------------------------------------------|----------|---------|\n              | paymentId  | string | Identificador \xFAnico do pagamento.        | Sim      |         |\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/capture'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"amount\": \"1035\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"status\": 3,\n                          \"returnCode\": \"0\",\n                          \"returnMessage\": \"Sucesso\",\n                          \"paymentId\": \"010000003811041456460000064215020000000000\",\n                          \"authorizationCode\": \"007019\",\n                          \"amount\": 3990,\n                          \"fees\": 260,\n                          \"liquid\": 3730,\n                          \"acquirer\": \"adiq\",\n                          \"releaseAt\": \"2021-11-04 11:56:50\"\n                      }\n              - name: Falha na Requisi\xE7\xE3o\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/capture'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"amount\": \"1035\"\n                      }\n                response:\n                  status: 200\n                  statusText: '400'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"code\": \"__general__\",\n                        \"message\": \"Transa\xE7\xE3o capturada.\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/capture'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"amount\": \"1035\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Cart\xF5es de Teste\n          type: folder\n          seq: 13\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Utilize os _**cart\xF5es**_ abaixo para testar todos os fluxos da API e mapeie os retornos esperados para cada opera\xE7\xE3o.\n\n            _Estes Cart\xF5es-Teste funcionam apenas no ambiente de Sand-Box._\n\n            > \uD83D\uDCD8 **Notas importantes para o teste:** \n              \n\n            | N\xFAmero do Cart\xE3o | Credenciais | Bandeira | Comportamento |\n            | --- | --- | --- | --- |\n            | 5201561050025011 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **bem sucedida**.  <br>Retorna status `1 - Pr\xE9-Capturado` ou `3 - Autorizado`. |\n            | 5407701420954753 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **negada - Cart\xE3o Expirado**.  <br>Retorna status `7 - Negada`. |\n            | 5294393544023057 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **negada - Cart\xE3o Cancelado**.  <br>Retorna status `7 - Negada`. |\n            | 5435496042806715 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **negada - Cart\xE3o Bloqueado**.  <br>Retorna status `7 - Negada`. |\n            | 5429496036975128 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **negada - Problemas com cart\xE3o de Cr\xE9dito**.  <br>Retorna status `7 - Negada`. |\n            | 5179152600128782 | **Cvv** 123 | MASTERCARD | Autoriza\xE7\xE3o **negada - N\xE3o autorizado**.  <br>Retorna status `7 - Negada`. |\n\n            > \uD83D\uDEA7 **Aten\xE7\xE3o**\n          type: text/markdown\n      - info:\n          name: Casos de Uso\n          type: folder\n          seq: 15\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Veja a seguir alguns casos de uso da API de Pagamentos e seus diferentes fluxos de liquida\xE7\xE3o e processamento.\n\n            <h2>Cria\xE7\xE3o de Pagamento Autorizado<\/h2>\n\n            A cria\xE7\xE3o de pagamento autorizado, tamb\xE9m chamado de _captura de pagamento_ consiste no processamento e efetiva\xE7\xE3o do pagamento no momento do envio da requisi\xE7\xE3o.\n\n            Esse \xE9 o fluxo mais utilizado nas aplica\xE7\xF5es-cliente do mercado.\n\n            Para voc\xEA criar um _**pagamento autorizado**_ ser\xE1 necess\xE1rio utilizar o par\xE2metro `capture` como `true` (verdadeiro).\n\n            A seguir veja um exemplo de requisi\xE7\xE3o para captura de pagamento:\n\n            ``` json\n            {\n              \"amount\": 1035,\n              \"payment\": {\n                \"type\": \"credit\",\n                \"installments\": 1,\n                \"capture\": true,\n                \"softdescriptor\": \"PAG*TESTE\",\n                \"card\": {\n                  \"holder\": \"TESTE HOLDER\",\n                  \"number\": \"5201561050025011\",\n                  \"expiry_month\": \"09\",\n                  \"expiry_year\": \"2024\",\n                  \"brand\": \"mastercard\",\n                  \"cvv\": \"123\"\n                }\n              },\n              \"customer\": {\n                \"name\": \"Comprador Teste\",\n                \"document\": \"99999999999\",\n                \"email\": \"example@test.com\",\n                \"phone\": \"11999999999\",\n                \"birthdate\": \"1969-12-31\",\n                \"billing_address\": {\n                  \"street\": \"Rua teste\",\n                  \"number\": \"1\",\n                  \"district\": \"Bairro teste\",\n                  \"complement\": \"Complemento teste\",\n                  \"zipcode\": \"99999999\",\n                  \"city\": \"S\xE3o Paulo\",\n                  \"state\": \"SP\",\n                  \"country\": \"BRA\"\n                }\n              }\n            }\n\n             ```\n\n            <h2>Cria\xE7\xE3o de Pagamento Pr\xE9-Autorizado<\/h2>\n\n            A cria\xE7\xE3o de pagamento pr\xE9-autorizado, tamb\xE9m chamado de pr\xE9-captura de pagamento, consiste no processamento pr\xE9vio do pagamento, reserva do dinheiro do cliente e efetiva\xE7\xE3o **parcial ou completa** do pagamento posterior a pr\xE9-captura do pagamento.\n\n            Veja a seguir uma esquematiza\xE7\xE3o da pr\xE9-captura de pagamento:\n\n            <img src=\"https://files.readme.io/19cf938-image.png\" alt=\"Esquematiza\xE7\xE3o do Fluxo de Processo para essa modalidade de pagamento\">\n\n            _Esquematiza\xE7\xE3o da Pr\xE9-Captura de Pagamento_\n\n            Geralmente nessa modalidade de pagamento s\xE3o utilizados para opera\xE7\xF5es que exigem **garantia do pagamento** ou a **seguran\xE7a do pagamento**, como hotelaria e aluguel de carros.\n\n            **Importante**: A pr\xE9-captura ser\xE1 **cancelada automaticamente** caso voc\xEA n\xE3o realize a captura em at\xE9 **5 dias** posterior a cria\xE7\xE3o do pagamento pr\xE9-autorizado.\n\n            A seguir veja um exemplo de requisi\xE7\xE3o para pr\xE9-captura de pagamento:\n\n            ``` json\n            {\n              \"amount\": 1035,\n              \"payment\": {\n                \"type\": \"credit\",\n                \"installments\": 1,\n                \"capture\": false,\n                \"softdescriptor\": \"PAG*TESTE\",\n                \"card\": {\n                  \"vault\": \"2beaeb98-391d-41d9-8685-61464f3c0789\"\n                }\n              },\n              \"customer\": {\n                \"name\": \"Comprador Teste\",\n                \"document\": \"99999999999\",\n                \"email\": \"example@test.com\",\n                \"phone\": \"11999999999\",\n                \"birthdate\": \"1969-12-31\",\n                \"billing_address\": {\n                  \"street\": \"Rua teste\",\n                  \"number\": \"1\",\n                  \"district\": \"Bairro teste\",\n                  \"complement\": \"Complemento teste\",\n                  \"zipcode\": \"99999999\",\n                  \"city\": \"S\xE3o Paulo\",\n                  \"state\": \"SP\",\n                  \"country\": \"BRA\"\n                }\n              }\n            }\n\n             ```\n\n            OBS: Atente-se ao _**valor capturado**_, pois ele n\xE3o pode ser maior que o _**valor pr\xE9-capturado original**_ na cria\xE7\xE3o do pagamento.\n\n            <h2>Criar Pagamento com Cofre de Cart\xE3o<\/h2>\n\n            A cria\xE7\xE3o de pagamentos com cofre de cart\xE3o consiste na utiliza\xE7\xE3o de um _**TOKEM**_ do Cart\xE3o armazenado no **cofre** para realizar uma **pr\xE9-autoriza\xE7\xE3o** ou **autoriza\xE7\xE3o** de pagamentos sem o envio dos dados do cart\xE3o abertos na requisi\xE7\xE3o.\n\n            Esse m\xE9todo de cria\xE7\xE3o de pagamentos \xE9 seguro e evita que os dados do cart\xE3o sejam capturados indevidamente na sua aplica\xE7\xE3o. Tamb\xE9m pode ser implementado a funcionalidade COMPRA COM UM CLIQUE, onde voc\xEA armazena apenas o TOKEM do cart\xE3o na sua aplica\xE7\xE3o.\n\n            Entretanto, para a cria\xE7\xE3o do pagamento utilizando essa modalidade \xE9 necess\xE1rio realizar a **tokeniza\xE7\xE3o pr\xE9via dos dados cart\xE3o** atrav\xE9s do endpoint de [Cria\xE7\xE3o de Cofre de Cart\xE3o](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#ae31bcae-6098-444b-a519-f29700a47e02).\n\n            A seguir veja um exemplo de requisi\xE7\xE3o para captura de pagamento com cofre de cart\xE3o:\n\n            ``` json\n            {\n              \"amount\": 1035,\n              \"payment\": {\n                \"type\": \"credit\",\n                \"installments\": 1,\n                \"capture\": true,\n                \"softdescriptor\": \"PAG*TESTE\",\n                \"card\": {\n                  \"vault\": \"2beaeb98-391d-41d9-8685-61464f3c0789\"\n                }\n              },\n              \"customer\": {\n                \"name\": \"Comprador Teste\",\n                \"document\": \"99999999999\",\n                \"email\": \"example@test.com\",\n                \"phone\": \"11999999999\",\n                \"birthdate\": \"1969-12-31\",\n                \"billing_address\": {\n                  \"street\": \"Rua teste\",\n                  \"number\": \"1\",\n                  \"district\": \"Bairro teste\",\n                  \"complement\": \"Complemento teste\",\n                  \"zipcode\": \"99999999\",\n                  \"city\": \"S\xE3o Paulo\",\n                  \"state\": \"SP\",\n                  \"country\": \"BRA\"\n                }\n              }\n            }\n\n             ```\n\n            OBS: Voc\xEA pode utilizar o TOKEM do Cart\xE3o para pagamentos de _**pr\xE9-captudos e/ou capturados.**_\n\n            <h2>Criando Pagamento com Split<\/h2>\n\n            A cria\xE7\xE3o de pagamento com o split consiste no processo de indica\xE7\xE3o dos Recebedores finais, alterando a **liquida\xE7\xE3o.**\n\n            O fluxo de aprova\xE7\xE3o da transa\xE7\xE3o n\xE3o est\xE1 vinculado no fluxo de liquida\xE7\xE3o. O sistema captura a transa\xE7\xE3o no Recebedor `primary` e promove a liquida\xE7\xE3o para os demais participantes da transa\xE7\xE3o `secondary`\n\n            Voc\xEA pode utilizar um pagamento com split tanto em uma pr\xE9-autoriza\xE7\xE3o ou na autoriza\xE7\xE3o.\n\n            Essa modalidade de pagamento \xE9 utilizada quando um segundo recebedor (`secondary`) recebe uma parte da transa\xE7\xE3o como Comiss\xE3o de venda ou Garantia por exemplo.\n\n            Por exemplo, ao fazer a venda de um produto online, voc\xEA pode dividir uma parte do pagamento para a transportadora do pedido e uma parte para a fornecedora do pedido, conseguindo assim, alterar o fluxo de liquida\xE7\xE3o no momento da cria\xE7\xE3o do pagamento.\n\n            Esta op\xE7\xE3o tem uma gama enorme de aplicabilidade, dependendo do fluxo da sua aplica\xE7\xE3o.\n\n            A seguir, esquematiza\xE7\xE3o do fluxo de processo realizado:\n\n            <img src=\"https://files.readme.io/a02d17c-Diagrama_sem_nome_2.jpg\" alt=\"Fluxo%20do%20Split%20de%20Pagamento\">\n\n            Obs: A transa\xE7\xE3o com Split de Pagamento s\xF3 pode ser realizada para Lojas cadastradas na plataforma RAKIM, desde que essas lojas estajam sob sua gest\xE3o ou que voc\xEA mesmo as tenha criado no ending point [Cria\xE7\xE3o de Lojas](https://rakimdevelopers.postman.co/workspace/ee0b02ef-ba3d-4dca-8b4d-61c6a6496517/folder/40662984-4d6c5066-1fac-41ae-8dd7-140a862a61aa?action=share&source=copy-link&creator=40662984&ctx=documentation)\n\n            <h2>Considera\xE7\xF5es do Split de Pagamento<\/h2>\n\n            Atente-se a estas considera\xE7\xF5es quando na cria\xE7\xE3o do pagamento com split:\n\n            - Considere como `PRIMARY`, o participante prim\xE1rio onde a transa\xE7\xE3o ser\xE1 registrada como origem do pagamento;\n                \n            - Considere como `SECONDARY`, participantes secund\xE1rios do split do pagamento que participam indiretamente da transa\xE7\xE3o;\n                \n            - S\xF3 \xE9 poss\xEDvel criar um split com um unico `primary` - **participante prim\xE1rio**;\n                \n            - O participante prim\xE1rio **n\xE3o pode receber menos que 1% do pagamento**;\n                \n            - A soma dos **valores divididos no split n\xE3o pode ser diferente do valor l\xEDquido da transa\xE7\xE3o**;\n                \n\n            A seguir veja um exemplo de requisi\xE7\xE3o para cria\xE7\xE3o de pagamentos com split de pagamento:\n\n            ``` json\n            {\n              \"amount\": 1035,\n              \"payment\": {\n                \"type\": \"credit\",\n                \"installments\": 1,\n                \"capture\": true,\n                \"card\": {\n                  \"holder\": \"TESTE HOLDER\",\n                  \"number\": \"5201561050025011\",\n                  \"expiryMonth\": \"09\",\n                  \"expiryYear\": \"2024\",\n                  \"brand\": \"mastercard\",\n                  \"cvv\": \"123\"\n                }\n              },\n              \"customer\": {\n                \"name\": \"Comprador Teste\",\n                \"document\": \"99999999999\",\n                \"email\": \"example@test.com\",\n                \"phone\": \"11999999999\",\n                \"birthdate\": \"1969-12-31\",\n                \"billingAddress\": {\n                  \"street\": \"Rua teste\",\n                  \"number\": \"1\",\n                  \"district\": \"Bairro teste\",\n                  \"complement\": \"Complemento teste\",\n                  \"zipcode\": \"99999999\",\n                  \"city\": \"S\xE3o Paulo\",\n                  \"state\": \"SP\",\n                  \"country\": \"BRA\"\n                }\n              },\n              \"splits\": [\n                {\n                  \"recipientToken\": \"9b7ba208a0e54094b9c06ef479acf4b29ddc1d3a\",\n                  \"merchantType\": \"PRIMARY\",\n                  \"chargeFee\": true,\n                  \"type\": \"PERCENTAGE\",\n                  \"amountSplit\": 6000\n                },\n                {\n                  \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                  \"merchantType\": \"SECONDARY\",\n                  \"type\": \"PERCENTAGE\",\n                  \"chargeFee\": false,\n                  \"discountGrossAmount\": false,\n                  \"amountSplit\": 4000\n                },\n                {\n                  \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d633\",\n                  \"merchantType\": \"SECONDARY\",\n                  \"type\": \"AMOUNT\",\n                  \"chargeFee\": false,\n                  \"discountGrossAmount\": false,\n                  \"amountSplit\": 200\n                }\n              ]\n            }\n\n             ```\n\n            <h2>Cria\xE7\xE3o de Pagamento com Split Tardio<\/h2>\n\n            A cria\xE7\xE3o de pagamento com o split tardio consiste no processo de indica\xE7\xE3o dos Recebedores finais, alterando a **liquida\xE7\xE3o.**\n\n            O fluxo de aprova\xE7\xE3o da transa\xE7\xE3o n\xE3o est\xE1 vinculado no fluxo de liquida\xE7\xE3o. O sistema captura a transa\xE7\xE3o no Recebedor `primary` e promove a liquida\xE7\xE3o para os demais participantes da transa\xE7\xE3o `secondary`\n\n            Voc\xEA pode utilizar um pagamento com split tanto em uma pr\xE9-autoriza\xE7\xE3o ou na autoriza\xE7\xE3o.\n\n            A diferen\xE7a est\xE1 na possibilidade de indicar os participantes `secondary` posteriormente a captura da transa\xE7\xE3o.\n\n            Esse processo \xE9 amplamente utilizado na venda de pacotes turisticos, onde o operador vende um pacote com multiplos fornecedores, mas n\xE3o sabe quem prestar\xE1 o servi\xE7o final. A informa\xE7\xE3o s\xF3 chega ao opertador _**DEPOIS**_ do servi\xE7o prestado. Dessa forma o sistema captura a transa\xE7\xE3o em nome do Operador Turistico e alguns dias depois promove a informa\xE7\xE3o dos prestadores (`secondary`), liquidando a transa\xE7\xE3o com a parte que cabe a cada prestador do servi\xE7o.\n\n            Veja a seguir o fluxo de processo:\n\n            <img src=\"https://files.readme.io/0000504-Diagrama_sem_nome_3.jpg\" alt=\"Fluxo%20do%20Split%20Tardio\">\n\n            _Fluxo do Split Tardio do Pagamento_\n\n            Sendo assim, observando o esquema, percebe-se a necessidade de realizar a [<b>requisi\xE7\xE3o de cria\xE7\xE3o do pagamento<\/b>](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#47116bd0-cb76-45f9-8598-2ac3197d8887) e a [<b>requisi\xE7\xE3o de ativa\xE7\xE3o do split tardio<\/b>](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#89aa9e42-85fa-4247-9de4-52118775f7dc).\n\n            Caso voc\xEA crie um pagamento como o _**Split Tardio**_ e por _**N\xC3O**_ defina posteriormente os participantes `secondary` atrav\xE9s do endpoint de [Ativa\xE7\xE3o do Split Tardio](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#89aa9e42-85fa-4247-9de4-52118775f7dc) , a liquida\xE7\xE3o da transa\xE7\xE3o **n\xE3o ser\xE1 efetivada at\xE9 que o estabelecimento onde a transa\xE7\xE3o ocorreu** **`primary`** **promova a informa\xE7\xE3o dos participantes** **`secondary`**\n\n            A seguir veja um exemplo de requisi\xE7\xE3o para cria\xE7\xE3o de pagamentos com split de pagamento tardio:\n\n            ``` json\n            {\n              \"amount\": 1035,\n              \"payment\": {\n                \"type\": \"credit\",\n                \"installments\": 1,\n                \"capture\": true,\n                \"delayed_split\": true,\n                \"softdescriptor\": \"PAG*TESTE\",\n                \"card\": {\n                  \"holder\": \"TESTE HOLDER\",\n                  \"number\": \"5201561050025011\",\n                  \"expiry_month\": \"09\",\n                  \"expiry_year\": \"2024\",\n                  \"brand\": \"mastercard\",\n                  \"cvv\": \"123\"\n                }\n              },\n              \"customer\": {\n                \"name\": \"Comprador Teste\",\n                \"document\": \"99999999999\",\n                \"email\": \"example@test.com\",\n                \"phone\": \"11999999999\",\n                \"birthdate\": \"1969-12-31\",\n                \"billing_address\": {\n                  \"street\": \"Rua teste\",\n                  \"number\": \"1\",\n                  \"district\": \"Bairro teste\",\n                  \"complement\": \"Complemento teste\",\n                  \"zipcode\": \"99999999\",\n                  \"city\": \"S\xE3o Paulo\",\n                  \"state\": \"SP\",\n                  \"country\": \"BRA\"\n                }\n              }\n            }\n\n             ```\n\n            Ap\xF3s a cria\xE7\xE3o do pagamento \xE9 necess\xE1rio a ativa\xE7\xE3o do split de pagamento, veja a seguir um exemplo de requisi\xE7\xE3o:\n\n            ``` json\n            {\n              \"orderId\": \"6183f4ac7ad8d\",\n              \"splits\": [\n                {\n                  \"recipientToken\": \"9b7ba208a0e54094b9c06ef479acf4b29ddc1d3a\",\n                  \"merchantType\": \"PRIMARY\",\n                  \"chargeFee\": true,\n                  \"type\": \"PERCENTAGE\",\n                  \"amountSplit\": 6000\n                },\n                {\n                  \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d651\",\n                  \"merchantType\": \"SECONDARY\",\n                  \"type\": \"PERCENTAGE\",\n                  \"chargeFee\": false,\n                  \"discountGrossAmount\": false,\n                  \"amountSplit\": 4000\n                },\n                {\n                  \"recipientToken\": \"4a723333747e4aa3ac10f12fa65af89e5057d633\",\n                  \"merchantType\": \"SECONDARY\",\n                  \"type\": \"AMOUNT\",\n                  \"chargeFee\": false,\n                  \"discountGrossAmount\": false,\n                  \"amountSplit\": 200\n                }\n              ]\n            }\n\n             ```\n\n            Vale ressaltar que devem ser consideradas algumas observa\xE7\xF5es:\n\n            - Caso a soma dos percentuais dos participantes do split tardio for maior que 100%, a ativa\xE7\xE3o do split tardio n\xE3o ser\xE1 realizada e continuar\xE1 pendente de ativa\xE7\xE3o.\n                \n            - Caso a soma dos percentuais dos participantes do split tardio for menor que 100%, a ativa\xE7\xE3o do split tardio ser\xE1 realizada e o participante prim\xE1rio receber\xE1 o resto percentual que sobrou do split criado.\n                \n            - Caso a taxa cobrada da plataforma pela autoriza\xE7\xE3o do pagamento for em cima do l\xEDquido do participante e o desconto dela sobre o participante resultar em um valor l\xEDquido a receber negativo, a ativa\xE7\xE3o do split tardio n\xE3o ser\xE1 realizada e continuar\xE1 pendente de ativa\xE7\xE3o.\n                \n            - Caso a taxa cobrada da plataforma n\xE3o for informada para ser paga por nenhum dos participantes atrav\xE9s do par\xE2metro `chargeFee`, ela ser\xE1 cobrada pelo participante prim\xE1rio da ativa\xE7\xE3o do split.\n                \n\n            Al\xE9m de considerar os casos acima, reveja as **Considera\xE7\xF5es do Split do Pagamento** para se integrar ao endpoint de ativa\xE7\xE3o do split.\n          type: text/markdown\n      - info:\n          name: Como Criar um Cofre de Cart\xE3o\n          type: folder\n          seq: 8\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA pode criar um _**cofre de cart\xE3o**_ para armazenar os dados do cart\xE3o de forma criptografada. O cofre \xE9 associado a Loja espec\xEDfica que \xE9 autentidada na API pelo **Tokem da Loja** e pode receber outros cart\xF5es de compradores diferentes.\n\n            O _**Tokem do cart\xE3o**_ pode ser utilizado para Pagamentos com um clique posteriormente.\n\n            Para mais informa\xE7\xF5es [clique aqui](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6).\n\n            ### VaultRequest\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | customerName | string | Nome do cliente pertencente ao cart\xE3o. | Sim |  |\n            | documentNumber | string | N\xFAmero do documento do cliente pertencente ao cart\xE3o. | Sim |  |\n            | cardNumber | string | N\xFAmero do cart\xE3o. | Sim |  |\n            | cardHolderName | string | Nome do portador do cart\xE3o impresso no cart\xE3o. | Sim |  |\n            | expirationMonth | string | M\xEAs de expira\xE7\xE3o do cart\xE3o com dois d\xEDgitos. | Sim |  |\n            | expirationYear | string | Ano de expira\xE7\xE3o do cart\xE3o com quatro d\xEDgitos. | Sim |  |\n            | securityCode | string | C\xF3digo de seguran\xE7a do cart\xE3o. | N\xE3o |  |\n            | brand | string | Bandeira do cart\xE3o. Valores poss\xEDveis:  <br>`Visa`  <br>`Mastercard`  <br>`Amex`  <br>`Elo`  <br>`Hipercard` | Sim |  |\n          type: text/markdown\n        items:\n          - info:\n              name: vault\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}payments/api/vaults/cards'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              ## Schemas\n\n              ### Parameters\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | paymentId | string | Identificador \xFAnico do pagamento. | Sim |  |\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}payments/api/vaults/cards'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"customerName\": \"Comprador Teste\",\n                        \"documentNumber\": \"99999999999\",\n                        \"cardNumber\": \"5201561050025011\",\n                        \"cardHolderName\": \"TESTE HOLDER\",\n                        \"expirationMonth\": \"09\",\n                        \"expirationYear\": \"24\",\n                        \"securityCode\": \"123\",\n                        \"brand\": \"mastercard\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"vaultId\": \"2beaeb98-391d-41d9-8685-61464f3c0789\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/vaults/cards'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"customerName\": \"Comprador Teste\",\n                        \"documentNumber\": \"99999999999\",\n                        \"cardNumber\": \"5201561050025011\",\n                        \"cardHolderName\": \"TESTE HOLDER\",\n                        \"expirationMonth\": \"09\",\n                        \"expirationYear\": \"24\",\n                        \"securityCode\": \"123\",\n                        \"brand\": \"mastercard\"\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Consultando as Taxas da Transa\xE7\xE3o\n          type: folder\n          seq: 11\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA pode consultar Taxas da Transa\xE7\xE3o detalhada.\n\n            A resposta inclui v\xE1rios atributos, como o n\xFAmero e valores das parcelas, taxas totais e valores l\xEDquidos.\n\n            ## Query Parameters\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | payment_methods | string | Meios de pagamento dos quais o integrador gostaria de recuperar taxas. | Sim |  |\n            | amount | int32 | Valor original da transa\xE7\xE3o. | Sim | 10000 |\n            | brand | string | A bandeira do cart\xE3o de cr\xE9dito. | N\xE3o |  |\n            | max_installments | int32 | Quantidade m\xE1xima de parcelas permitidas. | N\xE3o | 12 |\n          type: text/markdown\n        items:\n          - info:\n              name: Consultar taxas\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}payments/api/sales/fees/calculate'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              ## Schemas\n\n              ### Parameters\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | paymentId | string | Identificador \xFAnico do pagamento. | Sim |  |\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}payments/api/sales/fees/calculate?payment_methods=credit&amount=10000&b                          \"totalFee\": {\n                                    \"value\": 1129,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"liquid\": {\n                                    \"value\": 10000,\n                                    \"currency\": \"BRL\"\n                                  }\n                                },\n                                {\n                                  \"installments\": 6,\n                                  \"installmentValue\": 1874,\n                                  \"interestFree\": false,\n                                  \"amount\": {\n                                    \"value\": 11242,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"totalFee\": {\n                                    \"value\": 1242,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"liquid\": {\n                                    \"value\": 10000,\n                                    \"currency\": \"BRL\"\n                                  }\n                                },\n                                {\n                                  \"installments\": 7,\n                                  \"installmentValue\": 1627,\n                                  \"interestFree\": false,\n                                  \"amount\": {\n                                    \"value\": 11388,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"totalFee\": {\n                                    \"value\": 1388,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"liquid\": {\n                                    \"value\": 10000,\n                                    \"currency\": \"BRL\"\n                                  }\n                                },\n                                {\n                                  \"installments\": 8,\n                                  \"installmentValue\": 1439,\n                                  \"interestFree\": false,\n                                  \"amount\": {\n                                    \"value\": 11509,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"totalFee\": {\n                                    \"value\": 1509,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"liquid\": {\n                                    \"value\": 10000,\n                                    \"currency\": \"BRL\"\n                                  }\n                                },\n                                {\n                                  \"installments\": 9,\n                                  \"installmentValue\": 1292,\n                                  \"interestFree\": false,\n                                  \"amount\": {\n                                    \"value\": 11630,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"totalFee\": {\n                                    \"value\": 1630,\n                                    \"currency\": \"BRL\"\n                                  },\n                                  \"liquid\": {\n                                    \"value\": 10000,\n                                    \"currency\": \"BRL\"\n                                  }\n                                },\n                                {\n                                  \"installments\": 10,\n                                  \"installmentValue\": 1175,\n                  - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Transaction not found\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}payments/api/sales/:paymentId/cancel'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: paymentId\n                      value: '010000003811041456460000064215020000000000'\n                      type: path\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token not provided, authorization denied\"\n                      }\n      - info:\n          name: Criando um Pagamento\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA pode solicitar a cria\xE7\xE3o de um Pagamento **pr\xE9-autorizado** ou **autoriza\xE7\xE3o**.\n\n            Pagamento Pr\xE9-Autorizado \xE9 quando voc\xEA precisa travar um limite do cart\xE3o para uma garantia de pagamento. Um exemplo \xE9 a 'pr\xE9-autoriza\xE7\xE3o quando alugamos um carro';\n\n            Pagamento Autorizado \xE9 quando voc\xEA j\xE1 sabe o valor total que precisa ser autorizado no limite do cart\xE3o.\n\n            Contudo voc\xEA ainda pode realizar outros tipos de fluxos de autoriza\xE7\xE3o de pagamento como:\n\n            A) [Cria\xE7\xE3o de Pagamentos com Cofre de Cart\xE3o](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6),\n\n            B) [Cria\xE7\xE3o de Pagamento com Split](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6),\n\n            C) [Cria\xE7\xE3o de Pagamento Pr\xE9-Autorizado](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6)\n\n            D) [Cria\xE7\xE3o de Pagamento Autorizado](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#22600e87-7b71-48f5-9eae-561c8945ecb6).\n          type: text/markdown\n        items:\n          - info:\n              name: sales\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}payments/api/sales'\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              # API Documentation\n\n              ## Schemas\n\n              ### PaymentRequest\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | amount | number | Valor do pagamento em centavos sem v\xEDrgula e ponto. | Sim |  |\n              | order_id | string | Seu n\xFAmero de identifica\xE7\xE3o da compra/N\xFAmero do pedido. | N\xE3o |  |\n              | online_id | string | Seu n\xFAmero de identifica\xE7\xE3o adicional da compra. | N\xE3o |  |\n              | payment | Payment | Informa\xE7\xF5es do pagamento, modelo de autoriza\xE7\xE3o e fluxo a ser executado. | Sim |  |\n              | customer | Customer | Informa\xE7\xF5es relacionados ao cliente vinculado ao pagamento. | Sim |  |\n              | metadata | Metadata\\[\\] | O par\xE2metro metadata permite que os usu\xE1rios anexem informa\xE7\xF5es adicionais a uma transa\xE7\xE3o. Isso pode incluir qualquer par de chave-valor que forne\xE7a contexto ou detalhes adicionais sobre a transa\xE7\xE3o. O metadata n\xE3o \xE9 utilizado pela API para processar a transa\xE7\xE3o, mas pode ser \xFAtil para o registro do usu\xE1rio ou para a integra\xE7\xE3o com outros sistemas. | N\xE3o |  |\n\n              ---\n\n              ### Payment\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | type | string | Tipo de pagamento (ex: credit, debit, etc.). | Sim |  |\n              | installments | number | N\xFAmero de parcelas do pagamento. | Sim |  |\n              | capture | boolean | Indica se o pagamento deve ser autorizado no momento da cria\xE7\xE3o. Valores poss\xEDveis: Autoriza\xE7\xE3o - true, Pr\xE9-Autoriza\xE7\xE3o - false. | N\xE3o | Defaults to false |\n              | has_interest | boolean | Indica se o pagamento possui juros. | N\xE3o | Defaults to false |\n              | authenticate | boolean | Indica se o comprador ser\xE1 direcionado para o banco emissor para autentica\xE7\xE3o do cart\xE3o. Valores poss\xEDveis: Fluxo Normal - false Autentica\xE7\xE3o 3DS - true | N\xE3o | Defaults to false |\n              | softdescriptor | string | Texto exibido na fatura do cart\xE3o do comprador. Caso n\xE3o informado, ser\xE1 enviado o cadastrado na plataforma. | N\xE3o |  |\n              | currency_code | string | Moeda na qual o pagamento ser\xE1 processado. Valores poss\xEDveis: `BRL` | N\xE3o | Defaults to BRL |\n              | card | Card | Informa\xE7\xF5es do Cart\xE3o a qual processar\xE1 o pagamento. | N\xE3o |  |\n\n              ---\n\n              ### Card\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | holder | string | Nome do comprador impresso no cart\xE3o. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n              | number | string | N\xFAmero do cart\xE3o do comprador. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n              | expire_month | string | M\xEAs de expira\xE7\xE3o do cart\xE3o com dois d\xEDgitos. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n              | expire_year | string | Ano de expira\xE7\xE3o do cart\xE3o com quatro d\xEDgitos. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n              | brand | string | Bandeira do cart\xE3o. Valores poss\xEDveis: Visa, Mastercard, Amex, Elo, Hipercard. | Sim |  |\n              | cvc | string | C\xF3digo de seguran\xE7a impresso no cart\xE3o. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n              | vault | string | Identificador do cart\xE3o no cofre. Obrigat\xF3rio caso o pagamento seja tokenizado. | N\xE3o |  |\n\n              ---\n\n              ### Customer\n\n              | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n              | --- | --- | --- | --- | --- |\n              | name | string | Nome do comprador. | Sim |  |\n              | document | string | N\xFAmero do documento (CPF) do comprador. | Sim |  |\n              | email | string | E-mail do comprador. | N\xE3o |  |\n              | phone | string | Telefone do comprador. | N\xE3o |  |\n              | birthDate | string | Data de nascimento do comprador. | N\xE3o |  |\n              | ip | string | Endere\xE7o IP do dispositivo do comprador. | N\xE3o |  |\n              | billing_address | string | Endere\xE7o de cobran\xE7a. | N\xE3o |  |\n              | shipping_address | string | Endere\xE7o de envio. | N\xE3o       \"nsu\": \"61a7d95711f57\",\n                          \"customer\": {\n                              \"name\": \"Comprador Teste\",\n                              \"document\": \"99999999999\",\n                              \"email\": \"example@test.com\",\n                              \"phone\": \"11999999999\",\n                              \"birthDate\": \"1969-12-31\",\n                              \"billingAddress\": {\n                                  \"street\": \"Rua teste\",\n                                  \"number\": \"1\",\n                                  \"district\": \"Bairro teste\",\n                                  \"complement\": \"Complemento teste\",\n                                  \"zipcode\": \"99999999\",\n                                  \"city\": \"S\xE3o Paulo\",\n                                  \"state\": \"SP\",\n                                  \"country\": \"BRA\"\n                              }\n                          }\n                      }\n      - info:\n          name: Criando um Pagamento com Split\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Neste endpoint voc\xEA pode criar um pagamento **Pr\xE9-autorizado** ou **Autorizado** com um **S**_**plit de Liquida\xE7\xE3o**_ no arranjo de pagamento.\n\n            Para criar um pagamento com split \xE9 necess\xE1rio fazer um **POST** para o recurso _**Sales**_ informando no payload o valor da transa\xE7\xE3o em **Amount** com as informa\xE7\xF5es do pagamento dentro dos objetos payment e customer conforme o exemplo.\n\n            Tamb\xE9m \xE9 necess\xE1rio um **array de splits** com no m\xEDnimo dois objetos representando os integrantes do split de liquida\xE7\xE3o. O primeiro objeto do array **DEVE** ter o atributo merchantType definido como _PRIMARY_, e seu atributo recipientToken DEVE representar o accessToken vinculado ao lojista onde a transa\xE7\xE3o ocorreu.\n\n            Os demais objetos ter\xE3o o atributo merchantType como _SECONDARY_ e seu recipientToken referente ao accessToken de outro lojista que deseja participar do split.\n\n            _OBSERVA\xC7\xD5ES_:\n\n            - O array de splits s\xF3 aceita um \xFAnico integrante como PRIMARY.\n                \n            - O integrante PRIMARY _**N\xC3O**_ pode receber menos que 1% da transa\xE7\xE3o.\n                \n            - A soma dos valores a receber entre os participantes do split _**N\xC3O**_ pode ser diferente do valor l\xEDquido da transa\xE7\xE3o.\n                \n\n            # **Schemas**\n\n            ### PaymentRequest\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | amount | number | Valor do pagamento em centavos sem v\xEDrgula e ponto. | Sim |  |\n            | order_id | string | Seu n\xFAmero de identifica\xE7\xE3o da compra/N\xFAmero do pedido. | N\xE3o |  |\n            | online_id | string | Seu n\xFAmero de identifica\xE7\xE3o adicional da compra/N\xFAmero do pedido. | N\xE3o |  |\n            | payment | Payment | Informa\xE7\xF5es do pagamento, modelo de autoriza\xE7\xE3o e fluxo. | Sim |  |\n            | customer | Customer | Informa\xE7\xF5es do cliente. | Sim |  |\n            | splits | Split\\[\\] | Lista de divis\xF5es do pagamento. | N\xE3o |  |\n            | metadata | Metadata\\[\\] | O par\xE2metro metadata permite que os usu\xE1rios anexem informa\xE7\xF5es adicionais a uma transa\xE7\xE3o. Isso pode incluir qualquer par de chave-valor que forne\xE7a contexto ou detalhes adicionais sobre a transa\xE7\xE3o. O metadata n\xE3o \xE9 utilizado pela API para processar a transa\xE7\xE3o, mas pode ser \xFAtil para o registro do usu\xE1rio ou para a integra\xE7\xE3o com outros sistemas. | N\xE3o |  |\n\n            ---\n\n            ### Payment\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | type | string | Tipo de pagamento (ex: credit, debit, etc.). | Sim |  |\n            | installments | number | N\xFAmero de parcelas do pagamento. | Sim |  |\n            | capture | boolean | Indica se o pagamento deve ser autorizado no momento da cria\xE7\xE3o. Valores poss\xEDveis: Autoriza\xE7\xE3o - true, Pr\xE9-Autoriza\xE7\xE3o - false. | N\xE3o | Defaults to false |\n            | has_interest | boolean | Indica se o pagamento possui juros. | N\xE3o | Defaults to false |\n            | authenticate | boolean | Indica se o comprador ser\xE1 direcionado para o banco emissor para autentica\xE7\xE3o do cart\xE3o. Valores poss\xEDveis: Fluxo Normal - false Autentica\xE7\xE3o 3DS - true | N\xE3o | Defaults to false |\n            | softdescriptor | string | Texto exibido na fatura do cart\xE3o do comprador. Caso n\xE3o informado, ser\xE1 enviado o cadastrado na plataforma. | N\xE3o |  |\n            | currency_code | string | Moeda na qual o pagamento ser\xE1 processado. Valores poss\xEDveis: `BRL` | N\xE3o | Defaults to BRL |\n            | card | Card | Informa\xE7\xF5es do Cart\xE3o a qual processar\xE1 o pagamento. | N\xE3o |  |\n\n            ---\n\n            ### Card\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | holder | string | Nome do comprador impresso no cart\xE3o. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n            | number | string | N\xFAmero do cart\xE3o do comprador. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n            | expiryMonth | string | M\xEAs de expira\xE7\xE3o do cart\xE3o com dois d\xEDgitos. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n            | expiryYear | string | Ano de expira\xE7\xE3o do cart\xE3o com quatro d\xEDgitos. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n            | brand | string | Bandeira do cart\xE3o. Valores poss\xEDveis: Visa, Mastercard, Amex, Elo, Hipercard. | Sim |  |\n            | cvc | string | C\xF3digo de seguran\xE7a impresso no cart\xE3o. Obrigat\xF3rio caso o pagamento n\xE3o seja tokenizado. | N\xE3o |  |\n            | vault | string | Identificador do cart\xE3o no cofre. Obrigat\xF3rio caso o pagamento seja tokenizado. | N\xE3o |  |\n\n            ---\n\n            ### Customer\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | name | string | Nome do comprador. | Sim |  |\n            | document | string | N\xFAmero do documento (CPF) do comprador. | Sim |  |\n            | email | string | E-mail do comprador. | N\xE3o |  |\n            | phone | string | Telefone do comprador. | N\xE3o |  |\n            | birthDate | string | Data de nascimento do comprador. | N\xE3o |  |\n            | ip | string | Endere\xE7o IP do dispositivo do comprador. | N\xE3o |  |\n            | billing_address | string | Endere\xE7o de cobran\xE7a. | N\xE3o |  |\n            | shipping_address | string | Endere\xE7o de envio. | N\xE3o |  |\n\n            ---\n\n            ### Address\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | --- | --- | --- | --- | --- |\n            | street | string | Nome da rua. | N\xE3o |  |\n            | number | string | N\xFAmero do endere\xE7o. | N\xE3o |  |\n            | district | string | Bairro. | N\xE3o |  |\n            | complement | string | Complemento do endere\xE7o. | N\xE3o |  |\n            | city | string | Cidade. | N\xE3o |  |\n            | state | string | Estado abreviado. Ex: SP | N\xE3o |  |\n            | zipcode | string | CEP sem pontua\xE7\xF5es. Ex: 01451000 | N\xE3o |  |\n            | country | string | Pa\xEDs. Ex: Brasil | N\xE3o |  |\n\n            ---\n\n            ### Metadata\n\n            | Nome | Tipo | Descri\xE7\xE3o | Required | Default |\n            | ---
