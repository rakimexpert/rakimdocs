    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: Rakim Expert - API Documentation\nconfig:\n  environments:\n    - name: Rakim\n      variables:\n        - name: URL_SANDBOX\n          value: sandbox-api.rakim.com.br\n        - name: URL_PRODUCTION\n          value: api-expert.rakim.com.br\n        - name: URL\n          value: api-expert.rakim.com.br/\nitems:\n  - info:\n      name: Antecipa\xE7\xF5es\n      type: folder\n      seq: 9\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Atualizar Antecipa\xE7\xE3o Autom\xE1tica\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |\n            Esse \xE9 o endpoint destinado a atualiza\xE7\xE3o via API da antecipa\xE7\xE3o autom\xE1tica ou n\xE3o do estabelecimento. Se atente a qual tipo de opera\xE7\xE3o voc\xEA est\xE1 atualizando a antecipa\xE7\xE3o autom\xE1tica, visto que voc\xEA pode desativa-l\xE1 ou ativa-l\xE1 tanto em opera\xE7\xF5es onlines quanto opera\xE7\xF5es f\xEDsicas simultaneamente.\n\n            | Nome                  | Tipo   | Descri\xE7\xE3o                                                                          | Obrigat\xF3rio | Default |\n            |-----------------------|--------|----------------------------------------------------------------------------------|-------------|---------|\n            | automaticAntecipation | string | Indica se antecipa\xE7\xE3o ser\xE1 autom\xE1tica. Valores poss\xEDveis: Y - Ativar Antecipa\xE7\xE3o, N - Desativar Antecipa\xE7\xE3o. | Sim         | Y       |\n            | type                  | string | Tipo de opera\xE7\xE3o relacionada \xE0 antecipa\xE7\xE3o autom\xE1tica. Valores poss\xEDveis: pos - Opera\xE7\xE3o F\xEDsica, online - Opera\xE7\xE3o Digital. | Sim         | pos     |\n            | idCompany             | string | ID identificador do estabelecimento.                                              | Sim         | -       |\n          type: text/markdown\n        items:\n          - info:\n              name: Atualiza\xE7\xE3o Antecipa\xE7\xE3o\n              type: http\n              seq: 1\n            http:\n              method: PUT\n              url: '{{URL}}app/api/fee/anticipated'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              body:\n                type: json\n                data: |-\n                  {\n                      \"automaticAntecipation\": \"\",\n                      \"type\": \"\",\n                      \"idCompany\": \"\"\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/fee/anticipated'\n                  method: PUT\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"message\": \"Modalidade de antecipa\xE7\xE3o alterada.\"\n                      }\n              - name: Falha na Requisi\xE7\xE3o\n                request:\n                  url: '{{URL}}app/api/fee/anticipated'\n                  method: PUT\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '400'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token invalid\"\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Essa \xE9 a sess\xE3o de introdu\xE7\xE3o a **API de Antecipa\xE7\xE3o** oferecida pela nossa plataforma. Com ela voc\xEA pode manter controle sobre as antecipa\xE7\xF5es dispon\xEDveis pelo seu estabelecimento, gerenciar a antecipa\xE7\xE3o autom\xE1tica ou n\xE3o dos receb\xEDveis e poder solicitar tamb\xE9m a antecipa\xE7\xE3o de um receb\xEDvel futuro.\n\n            Considere como **antecipa\xE7\xE3o** o processo de liquida\xE7\xE3o antecipado de um receb\xEDvel. Por exemplo, caso voc\xEA seja um lojista e realize um pagamento de R$100,00 **hoje**, teoricamente, voc\xEA receberia o valor l\xEDquido desse pagamento, ap\xF3s trinta dias da captura do pagamento (o que chamamos de pagamento D+30), entretanto, o recebimento l\xEDquido dessa transa\xE7\xE3o (chamado de receb\xEDvel) pode ser antecipado e voc\xEA pode receber ap\xF3s um dia da captura do pagamento (o que chamamos de pagamento antecipado ou D+1).\n\n            Assim, a antecipa\xE7\xE3o trata-se de um modelo em que voc\xEA recebe seus pagamentos um dia ap\xF3s a captura do pagamento. Voc\xEA pode atualizar o modelo de antecipa\xE7\xE3o para autom\xE1tica atrav\xE9s do endpoint de [Atualiza\xE7\xE3o de Antecipa\xE7\xE3o Autom\xE1tica para o Estabelecimento](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#f786faca-c234-43a5-812d-2cfee91d4ce1), ou, solicitar manualmente uma antecipa\xE7\xE3 caso voc\xEA n\xE3o trabalhe no modelo automatizado atrav\xE9s do endpoint de [Solicita\xE7\xE3o de Antecipa\xE7\xE3o](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#3e06f757-dc38-4bfb-bbb9-0e389548f5fa).\n\n            ## Como posso gerenciar minhas antecipa\xE7\xF5es e visualizar minhas taxas?\n\n            A seguir h\xE1 uma pequena demonstra\xE7\xE3o de como voc\xEA consegue **encontrar e visualizar sua taxa de antecipa\xE7\xE3o manual** e como **solicitar e visualizar sua antecipa\xE7\xE3o de receb\xEDvel** atrav\xE9s da interface web do administrador da plataforma.\n\n            <img src=\"https://files.readme.io/9a63fc2-Frame_2.png\" alt=\"Frame 2\">\n\n            Para acessar essa \xE1rea acesse o link, [clicando aqui](https://api.rakim.com.br/dashboard/anticipations). Vale ressaltar, que essa \xE9 a **taxa de antecipa\xE7\xE3o manual**, na qual \xE9 diferente da **taxa de antecipa\xE7\xE3o autom\xE1tica**. Veja a seguir a diferen\xE7a entre as duas:\n\n            ### Taxa de Antecipa\xE7\xE3o Manual\n\n            Trata-se da taxa aplicada quando a loja realiza uma antecipa\xE7\xE3o moment\xE2nea de alguns receb\xEDveis. Essa taxa \xE9 aplicada quando a loja n\xE3o utiliza o modelo de antecipa\xE7\xE3o autom\xE1tica e precisa realizar uma antecipa\xE7\xE3o repentina de algum receb\xEDvel. Nesse modelo, apenas os **receb\xEDveis selecionados ser\xE3o antecipados**.\n\n            ### Taxa de Antecipa\xE7\xE3o Autom\xE1tica\n\n            Trata-se da taxa aplicada para todos pagamentos aprovados ap\xF3s a ativa\xE7\xE3o consequente da aprova\xE7\xE3o da solicita\xE7\xE3o de antecipa\xE7\xE3o autom\xE1tica pela loja. Nesse modelo, **todos os pagamentos criados ap\xF3s a ativa\xE7\xE3o da antecipa\xE7\xE3o autom\xE1tica ter\xE3o seus receb\xEDveis antecipados**. Veja a seguir como encontrar sua taxa de antecipa\xE7\xE3o autom\xE1tica:\n\n            <img src=\"https://files.readme.io/9a63fc2-Frame_2.png\" alt=\"Frame 2\">\n\n            Para acessar essa \xE1rea acesse o link, [clicando aqui](https://api.rakim.com.br/dashboard/myrates).\n          type: text/markdown\n      - info:\n          name: Solicitar Antecipa\xE7\xE3o\n          type: folder\n          seq: 4\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esse \xE9 o endpoint destinada a consulta dos pagamentos aprovados que est\xE3o dispon\xEDveis a serem antecipados.\n\n            ## Path Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | accessToken | string | C\xF3digo identificador do estabelecimento. | Sim |  |\n\n            ## Body Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | anticipations | Anticipation[] | Lista de todos os pagamentos para solicitar a antecipa\xE7\xE3o do pagamento. | Sim |  |\n\n            ### Anticipation\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | paymentId | number | ID identificador do pagamento | Sim |  |\n          type: text/markdown\n        items:\n          - info:\n              name: Solicitar Antecipa\xE7\xE3o\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/anticipations/request/:accessToken'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: accessToken\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/anticipations/request/:accessToken'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Pagamentos antecipados com sucesso!\"\n                      }\n              - name: N\xE3o Encontrado\n                request:\n                  url: '{{URL}}app/api/anticipations/request/:accessToken'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Estabelecimento n\xE3o encontrado\"\n                      }\n              - name: N\xE3o Autorizado\n                request:\n                  url: '{{URL}}app/api/anticipations/request/:accessToken'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"anticipations\": [\n                          {\n                            \"paymentId\": 2\n                          }\n                        ]\n                      }\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Estabelecimento n\xE3o encontrado\"\n                      }\n      - info:\n          name: Listar Antecipa\xE7\xF5es Dispon\xEDveis\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esse \xE9 o endpoint destinada a consulta dos pagamentos aprovados que est\xE3o dispon\xEDveis a serem antecipados.\n\n            ## Path Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | accessToken | string | C\xF3digo identificador do estabelecimento. | Sim |  |\n          type: text/markdown\n        items:\n          - info:\n              name: Listar Antecipa\xE7\xF5es\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}app/api/anticipations/available/:accessToken'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: accessToken\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/anticipations/available/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"anticipationsAvailable\": [\n                          {\n                            \"anticipationRate\": 3.06,\n                            \"companyName\": \"Sophia e Ayla Financeira ME\",\n                            \"installmentNumber\": 2,\n                            \"amount\": 125,\n                            \"paymentDate\": \"2023-01-30 00:00:00\",\n                            \"authorization\": \"380357\",\n                            \"paymentId\": 175,\n                            \"detailsAnticipated\": {\n                              \"daysAnticipated\": 62,\n                              \"finalAnticipatedRate\": 6.32,\n                              \"finalAnticipatedAmountRate\": 7.9,\n                              \"netValueAnticipated\": 117.1\n                            }\n                          },\n                          {\n                            \"anticipationRate\": 3.06,\n                            \"companyName\": \"Sophia e Ayla Financeira ME\",\n                            \"installmentNumber\": 3,\n                            \"amount\": 125,\n                            \"paymentDate\": \"2023-03-02 00:00:00\",\n                            \"authorization\": \"380357\",\n                            \"paymentId\": 176,\n                            \"detailsAnticipated\": {\n                              \"daysAnticipated\": 93,\n                              \"finalAnticipatedRate\": 9.49,\n                              \"finalAnticipatedAmountRate\": 11.86,\n                              \"netValueAnticipated\": 113.14\n                            }\n                          }\n                        ]\n                      }\n              - name: N\xE3o Encontrado\n                request:\n                  url: '{{URL}}app/api/anticipations/available/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Estabelecimento n\xE3o encontrado\"\n                      }\n              - name: N\xE3o Autorizado\n                request:\n                  url: '{{URL}}app/api/anticipations/available/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: accessToken\n                      value: ''\n                      type: path\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"automaticAntecipation\": \"Y\",\n                        \"type\": \"pos\",\n                        \"idCompany\": 1\n                      }\n                response:\n                  status: .nan\n                  statusText: '404'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token invalid\"\n                      }\n  - info:\n      name: Autentica\xE7\xE3o\n      type: folder\n      seq: 2\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Autentica\xE7\xE3o de Aplicativo\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        items:\n          - info:\n              name: Autentica\xE7\xE3o de Aplicativo\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/login'\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: Esse \xE9 o endpoint destinado a **Autentica\xE7\xE3o de Aplicativo (AppAuth)** na qual contempla os recursos de **Estabelecimento** e **Antecipa\xE7\xE3o**. Para mais informa\xE7\xF5es a respeito da autentica\xE7\xE3o [clique aqui](https://go.postman.co/workspace/ee0b02ef-ba3d-4dca-8b4d-61c6a6496517/documentation/40662984-e8d69f87-01de-4273-81a1-0cc9713bce68?entity=folder-462c2b70-7030-4123-9932-586913010790).\n            examples:\n              - name: Autentica\xE7\xE3o de Aplicativo\n                request:\n                  url: '{{URL}}api/login'\n                  method: GET\n                response:\n                  status: 200\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: '{}'\n      - info:\n          name: Introdu\xE7\xE3o a Autentica\xE7\xE3o - Rakim Global API's\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esta sess\xE3o exemplifica o _**Modo**_ de autentica\xE7\xE3o da _**RAKIM GLOBAL API's.**_\n\n            Dependendo do endpoint utilizado, se faz necess\xE1rio um modelo de autentica\xE7\xE3o aderente ao m\xE9todo chamado.\n\n            Por exemplo, ao chamar recursos como \"_Estabelecimentos_\", \"_Antecipa\xE7\xF5es_\", \"_Pagamentos_\", \"_Link's de Pagamento_\", \"_Recorr\xEAncia_\", \"_Liquida\xE7\xF5es_\" e \"_Pix_\" ser\xE1 necess\xE1rio a utiliza\xE7\xE3o da **autentica\xE7\xE3o de pagamento**.\n\n            ## Autentica\xE7\xE3o de Pagamento\n\n            A **Autentica\xE7\xE3o de Pagamento** \xE9 um m\xE9todo de autoriza\xE7\xE3o por _**Chave \xDAnica,**_ cuja \xE9 respons\xE1vel por identificar o cliente pelo _**TOKEM**_ fornecido e validar seu acesso ao endpoint.\n\n            Nesse estilo de autentica\xE7\xE3o, n\xE3o h\xE1 a necessidade de gera\xE7\xE3o de um token tempor\xE1rio de sess\xE3o, pois \xE9 baseado no padr\xE3o _**Bearer Authentication**_.\n\n            | Recursos desse m\xE9todo: |\n            | --- |\n            | Estabelecimentos |\n            | Antecipa\xE7\xF5es |\n            | Pagamentos |\n            | Link de Pagamentos |\n            | Recorr\xEAncia |\n            | Liquida\xE7\xF5es |\n            | Pix |\n            | Webhook's |\n\n            ### Como obter a chave unica de autentica\xE7\xE3o? (TOKEM)\n\n            Para obter a chave \xFAnica de autentica\xE7\xE3o de pagamento, **(**_**TOKEN DE INTEGRA\xC7\xC3O)**_, \xE9 necess\xE1rio logar na plataforma [https://expert.rakim.com/login](https://expert.rakim.com/login), clicar no link: **\"Minha Conta\"** e acessar o sub-link **\"Meus Dados\".**\n\n            Voc\xEA precisar\xE1 de um usu\xE1rio com **permiss\xE3o de visualiza\xE7\xE3o da Chave de Autentica\xE7\xE3o.**\n\n            <img src=\"https://content.pstmn.io/e867d038-488f-425b-a26b-537da38fbaf9/Q2FwdHVyYSBkZSBUZWxhIDIwMjUtMDEtMjkgYcyAcyAxNC40OC41Ny5wbmc=\">\n          type: text/markdown\n  - info:\n      name: Estabelecimentos\n      type: folder\n      seq: 7\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Buscar Estabelecimento\n          type: folder\n          seq: 4\n        request:\n          auth: inherit\n        docs:\n          content: |\n            Esse \xE9 o endpoint destinado a busca de informa\xE7\xF5es do estabelecimento atrav\xE9s de seu `access_token`.\n\n            ## Path Params\n\n            ### Geral\n            | Nome           | Tipo   | Descri\xE7\xE3o                                                                                       | Obrigat\xF3rio | Default |\n            |-----------------|--------|------------------------------------------------------------------------------------------------|-------------|---------|\n            | **accessToken**      | string  | Token de Acesso do Estabelecimento.                                            | Sim         | -       |\n          type: text/markdown\n        items:\n          - info:\n              name: Busca estabelecimento\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}app/api/companies/list/:accessToken'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: accessToken\n                  value: ''\n                  type: path\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/companies/list/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: accessToken\n                      value: 7612adf805f3408786d9181474977fd607149331\n                      type: path\n                response:\n                  status: 200\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"company\": {\n                              \"properties\": {\n                                  \"mccCode\": \"8931\",\n                                  \"mccDescription\": \"Contadores\",\n                                  \"companyName\": \"Bruno E Ana Consultoria Financeira Me\",\n                                  \"socialReason\": \"Bruno E Ana Consultoria Financeira Me\",\n                                  \"type\": \"CNPJ\",\n                                  \"typeClass\": \"STO\",\n                                  \"documentNumber\": \"80017668000180\",\n                                  \"softDescriptor\": \"consultoria\",\n                                  \"active\": \"active\"\n                              }\n                          },\n                          \"address\": {\n                              \"properties\": {\n                                  \"street\": \"Avenida Caetano Ruggieri\",\n                                  \"number\": \"259\",\n                                  \"district\": \"Parque Das Rosas\",\n                                  \"city\": \"Itu\",\n                                  \"state\": \"SP\",\n                                  \"complement\": null,\n                                  \"zipCode\": \"13310600\",\n                                  \"country\": \"BRA\"\n                              }\n                          },\n                          \"contact\": {\n                              \"properties\": {\n                                  \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                                  \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                                  \"mobile\": \"11997098755\",\n                                  \"document\": \"18613145078\"\n                              }\n                          },\n                          \"bankAccount\": {\n                              \"properties\": {\n                                  \"accountNumber\": \"1066888\",\n                                  \"accountDigit\": \"8\",\n                                  \"branchNumber\": \"1202\",\n                                  \"branchDigit\": null,\n                                  \"bankCode\": \"000\",\n                                  \"bankName\": \"BANCO TESTE\"\n                              }\n                          }\n                      }\n              - name: Falha na Requisi\xE7\xE3o\n                request:\n                  url: '{{URL}}app/api/companies/list/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: accessToken\n                      value: 7612adf805f3408786d9181474977fd607149331\n                      type: path\n                response:\n                  status: 200\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"code\": \"\",\n                        \"message\": \"\"\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}app/api/companies/list/:accessToken'\n                  method: GET\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  params:\n                    - name: accessToken\n                      value: 7612adf805f3408786d9181474977fd607149331\n                      type: path\n                response:\n                  status: 200\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"\"\n                      }\n      - info:\n          name: Casos de Uso\n          type: folder\n          seq: 7\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Essa \xE9 a sess\xE3o da documenta\xE7\xE3o destinada ao esclarecimento de casos de uso relacionados a API de Estabelecimentos. Nela, voc\xEA encontrar\xE1 exemplos de uso e observa\xE7\xF5es sobre a utiliza\xE7\xE3o da API.\n\n            ## Cria\xE7\xE3o de Estabelecimento\n\n            A [cria\xE7\xE3o de estabelecimento](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#4d6c5066-1fac-41ae-8dd7-140a862a61aa) s\xF3 pode ser utilizada por **estabelecimentos criados como whitelabel** em nossa plataforma. Assim, **estabelecimentos criados como loja** n\xE3o podem usufruir dessa funcionalidade, visto que a ideia desse endpoint \xE9 oportunizar a cria\xE7\xE3o de lojas para empresas que possuem outras abaixo dela, como franqueadoras, matrizes e outras.\n\n            Al\xE9m disso, considere **estabelecimentos** como quaisquer companhias/empresas/pessoas usu\xE1rias da plataforma, seja eles pessoa f\xEDsica ou pessoa jur\xEDdica. Dessa maneira, no [endpoint cria\xE7\xE3o de estabelecimento](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#4d6c5066-1fac-41ae-8dd7-140a862a61aa) \xE9 poss\xEDvel criar tanto estabelecimentos em nome de pessoa f\xEDsica quanto pessoa jur\xEDdica.\\]\n\n            ## Cria\xE7\xE3o de Estabelecimento - Pessoa F\xEDsica\n\n            Para a cria\xE7\xE3o de estabelecimentos em nome de pessoa f\xEDsica \xE9 necess\xE1rio fazer algumas considera\xE7\xF5es de adapta\xE7\xE3o do envio da requisi\xE7\xE3o na API:\n\n            - Considere como o par\xE2metro `commercialName`, o nome de marca da pessoa f\xEDsica;\n                \n            - Considere como o par\xE2metro `socialReason`, o nome completo da pessoa f\xEDsica;\n                \n            - Considere como o par\xE2metro `documentNumber`, o n\xFAmero do cadastro de pessoa f\xEDsica (CPF);\n                \n            - Considere como o par\xE2metro `cnaeId`, o ID identificador do cnae `7490-1/99` reservado para pessoas f\xEDsicas em nossa plataforma ([clique aqui](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#a9a8994c-ba0a-4904-9e2d-97ac15149360) para obter mais informa\xE7\xF5es do endpoint de listagem dos CNAE's);\n                \n            - Considere como o par\xE2metro `foundationDate`, a data de nascimento da pessoa f\xEDsica;\n                \n            - Considere como o par\xE2metro `companyFormationCode` igual a `06 - Empresa Individual de Responsabilidade Limitada` para pessoas f\xEDsicas;\n                \n            - Considere como o par\xE2metro `representative`, os dados da pr\xF3pria pessoa f\xEDsica;\n                \n            - Considere como o par\xE2metro `address`, o endere\xE7o da pessoa f\xEDsica;\n                \n\n            Al\xE9m disso, a **conta banc\xE1ria** deve ser vinculado ao n\xFAmero do documento da pessoa f\xEDsica e os dados cadastrais e \xE9 onde ser\xE1 realizada as liquida\xE7\xF5es de pagamento criadas na plataforma.\n\n            ## Cria\xE7\xE3o de Estabelecimento - Pessoa Jur\xEDdica\n\n            A cria\xE7\xE3o de estabelecimento em nome da pessoa jur\xEDdica \xE9 intuitiva e conforme os par\xE2metros necess\xE1rios no [endpoint cria\xE7\xE3o de estabelecimento](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#4d6c5066-1fac-41ae-8dd7-140a862a61aa). Entretanto, \xE9 necess\xE1rio que os dados enviados estejam de acordo com o Cart\xE3o CNPJ da empresa, visto que, cadastro de estabelecimentos com informa\xE7\xF5es inconsistentes como `tipo de composi\xE7\xE3o da empresa`, `endere\xE7os cadastrais`, `representantes`, entre outros, poder\xE3o ser recusados.\n\n            Por outro lado, assim como na pessoa f\xEDsica, a **conta banc\xE1ria** deve estar vinculada ao CNPJ do estabelecimento, visto que, liquida\xE7\xF5es de pagamentos, n\xE3o ser\xE3o realizadas para contas banc\xE1rias n\xE3o vinculadas ao CNPJ.\n          type: text/markdown\n      - info:\n          name: Criar Estabelecimento\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            EndPoint destinado a cria\xE7\xE3o de Lojas\n\n            ## Par\xE2metros do Objeto\n\n            ### Estabelecimento\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **commercialName** | string | Nome comercial da loja. | Sim | \\- |\n            | **type** | int32 | Tipo de Estabelecimento:  <br>1 - Pessoa F\xEDsica  <br>2 - Pessoa Jur\xEDdica. | Sim | \\- |\n            | **typeClass** | string | Tipo de classe. Valores poss\xEDveis: `STO` - Loja. | N\xE3o | STO |\n            | **socialReason** | string | Raz\xE3o social da empresa. | Sim | \\- |\n            | **documentNumber** | string | N\xFAmero do documento de estabelecimento. | Sim | \\- |\n            | **cnaeId** | int32 | ID identificador do CNAE. Consulte o ID identificador do CNAE clicando [aqui](#). | Sim | \\- |\n            | **softDescriptor** | string | Texto exibido na fatura do cart\xE3o do comprador. | Sim | \\- |\n            | **siteUrl** | string | Site do Estabelecimento. | N\xE3o | \\- |\n            | **companyId** | number | Codigo identificador do whiteLabel | Sim |  |\n            | **foundationDate** | date | Data de Funda\xE7\xE3o do estabelecimento. | Sim | \\- |\n            | **companyFormationCode** | string | Tipo da composi\xE7\xE3o da empresa:  <br>`01` - Sociedade An\xF4nima  <br>`02` - Limitada  <br>`03` - Microempreendedor Individual  <br>`04` - Microempresa  <br>`05` - Empresa de Pequeno Porte  <br>`06` - Empresa Individual de Responsabilidade Limitada | Sim | \\- |\n            | **automaticAntecipation** | boolean | Indica se o estabelecimento ir\xE1 trabalhar com antecipa\xE7\xE3o autom\xE1tica. | N\xE3o | false |\n            | **isTransactionsPix** | string | Indica se o estabelecimento ir\xE1 trabalhar com transa\xE7\xF5es de Pix. | N\xE3o | false |\n            | **representative** | Representative | Informa\xE7\xF5es do representante do estabelecimento. | Sim |  |\n            | **address** | Address | Endere\xE7o do Estabelecimento. | Sim |  |\n            | **contact** | Contact | Informa\xE7\xF5es de contato do estabelecimento. | Sim |  |\n            | **bankAccount** | BankAccount | Conta Banc\xE1ria do estabelecimento. | Sim |  |\n\n            ### Representative\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **name** | string | Nome completo do representante do Estabelecimento. | Sim | \\- |\n            | **mother** | string | Nome completo da M\xE3e do Representante. Obrigat\xF3rio quando `isTransactionsPix` for `true`. | N\xE3o | \\- |\n            | **email** | string | E-mail do Representante. | Sim | \\- |\n            | **mobile** | string | Celular do Representante. | Sim | \\- |\n            | **birthDate** | date | Data de nascimento do Representante. | Sim | \\- |\n            | **cpf** | string | CPF do Representante. | Sim | \\- |\n            | **rg** | string | RG do Representante. | N\xE3o | \\- |\n            | **address** | Address | Endere\xE7o do Representante.  <br>Obrigat\xF3rio quando o isTransactionsPix for true. | N\xE3o |  |\n\n            #### Address\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **zipcode** | string | O CEP do endere\xE7o. | Sim | \\- |\n            | **street** | string | Logradouro do endere\xE7o. | Sim | \\- |\n            | **number** | string | N\xFAmero do endere\xE7o. | Sim | \\- |\n            | **district** | string | Bairro do endere\xE7o. | Sim | \\- |\n            | **complement** | string | Complemento do endere\xE7o. | N\xE3o | \\- |\n            | **city** | string | Cidade do endere\xE7o. | Sim | \\- |\n            | **state** | string | Estado (sigla) do endere\xE7o. | Sim | \\- |\n\n            ### Contact\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **name** | string | Nome completo do contato. | Sim | \\- |\n            | **email** | string | Email do contato. | Sim | \\- |\n            | **mobile** | string | Celular do contato. | Sim | \\- |\n            | **birthDate** | date | Data de nascimento do contato. | N\xE3o | \\- |\n            | **cpf** | string | CPF do contato. | N\xE3o | \\- |\n            | **rg** | string | RG do contato. | N\xE3o | \\- |\n\n            ### BankAccount\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **bankAccountTypeId** | string | Tipo de Conta. Valores poss\xEDveis:  <br>`1` - Conta Corrente. | Sim | \\- |\n            | **bankId** | int32 | ID identificador do banco. Consulte os bancos dispon\xEDveis na plataforma. | Sim | \\- |\n            | **agency** | string | Ag\xEAncia do Estabelecimento. | Sim | \\- |\n            | **digitAgency** | string | D\xEDgito da Ag\xEAncia. | N\xE3o | \\- |\n            | **account** | string | N\xFAmero da conta. | Sim | \\- |\n            | **digitAccount** | string | D\xEDgito da conta. | Sim | \\- |\n            | **holderTypeId** | string | Tipo de estabelecimento:  <br>`1` - Pessoa F\xEDsica  <br>`2` - Pessoa Jur\xEDdica. | Sim | \\- |\n            | **pixKey** | string | Chave PIX da conta. Aceitamos apenas chave aleat\xF3ria. | N\xE3o | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Criar Estabelecimento\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/companies/create'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/companies/create'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"representative\": { etano Ruggieri\",\n                          \"number\": 259,\n                          \"district\": \"Parque das Rosas\",\n                          \"city\": \"Itu\",\n                          \"state\": \"SP\"\n                        },\n                        \"contact\": {\n                          \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                          \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                          \"mobile\": \"11997098755\"\n                        },\n                        \"bankAccount\": {\n                          \"bankAccountTypeId\": 1,\n                          \"bankId\": 120,\n                          \"agency\": \"1202\",\n                          \"account\": \"1066888\",\n                          \"digitAccount\": \"8\",\n                          \"holderTypeId\": \"2\",\n                          \"pixKey\": \"f359d4cc-97ca-4bea-bd91-8a89af69aadd\"\n                        },\n                        \"commercialName\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"type\": 2,\n                        \"typeClass\": \"STO\",\n                        \"socialReason\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"documentNumber\": \"80017668000180\",\n                        \"cnaeId\": 656,\n                        \"foundationDate\": \"2019-01-05\",\n                        \"companyFormationCode\": \"04\",\n                        \"automaticAntecipation\": true,\n                        \"isTransactionsPix\": true\n                      }\n                response:\n                  status: 200\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Estabelecimento j\xE1 cadastrado.\"\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: \"Essa \xE9 a sess\xE3o da documenta\xE7\xE3o destinada ao esclarecimento do escopo de estabelecimentos na plataforma.\\n\\nVale ressaltar, que escopo \xE9 destinado apenas para clientes que s\xE3o contemplados pela modalidade\\_**whitelabel**, ou seja, empresas que tem a possibilidade de adicionar e integrar novas lojas na plataforma a baixo deles.\"\n          type: text/markdown\n      - info:\n          name: Listar Bancos\n          type: folder\n          seq: 6\n        request:\n          auth: inherit\n        docs:\n          content: Esse \xE9 o endpoint destinada a listagem de todos os bancos suportados pela nossa API para cadastro de estabelecimento na plataforma.\n          type: text/markdown\n        items:\n          - info:\n              name: Listar Bancos\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}app/api/banks'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              body:\n                type: json\n                data: ''\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/cnae'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: type\n                      value: '2'\n                      type: query\n                      disabled: true\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"representative\": {\n                          \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                          \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                          \"mobile\": \"11997098755\",\n                          \"cpf\": \"99999999999\",\n                          \"birthDate\": \"1956-01-03\"\n                        },\n                        \"address\": {\n                          \"zipcode\": \"13310600\",\n                          \"street\": \"Avenida Caetano Ruggieri\",\n                          \"number\": 259,\n                          \"district\": \"Parque das Rosas\",\n                          \"city\": \"Itu\",\n                          \"state\": \"SP\"\n                        },\n                        \"contact\": {\n                          \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                          \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                          \"mobile\": \"11997098755\"\n                        },\n                        \"bankAccount\": {\n                          \"bankAccountTypeId\": 1,\n                          \"bankId\": 120,\n                          \"agency\": \"1202\",\n                          \"account\": \"1066888\",\n                          \"digitAccount\": \"8\",\n                          \"holderTypeId\": \"2\"\n                        },\n                        \"commercialName\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"type\": 2,\n                        \"typeClass\": \"STO\",\n                        \"socialReason\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"documentNumber\": \"80017668000180\",\n                        \"cnaeId\": 656,\n                        \"foundationDate\": \"2019-01-05\",\n                        \"companyFormationCode\": \"04\",\n                        \"automaticAntecipation\": true,\n                        \"isTransactionsPix\": true\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      [\n                        {\n                          \"bankId\": 1,\n                          \"code\": \"356\",\n                          \"name\": \"BANCO REAL S.A.\",\n                          \"ispb\": \"00000000\",\n                          \"active\": \"A\"\n                        }\n                      ]\n      - info:\n          name: Listar CNAE's\n          type: folder\n          seq: 5\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Esse \xE9 o endpoint destinado a listar todos os CNAE's que est\xE3o dispon\xEDveis em nossa plataforma. Com ele voc\xEA consegue obter o ID do CNAE relacionado a Classifica\xE7\xE3o Nacional de Atividades Econ\xF4micas da sua empresa para ser utilizada no momento de cria\xE7\xE3o do estabelecimento.\n\n            ## Query\n\n            ### Estabelecimento\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **type** | string | Tipo do CNAE que deseja consultar. Valores permitidos:  <br>  <br>`1 - Pessoa F\xEDsica`  <br>`2 - Pessoa Jur\xEDdica` | N\xE3o | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Listar CNAE's\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{URL}}app/api/cnae'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/cnae?type=2'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: type\n                      value: '2'\n                      type: query\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"representative\": {\n                          \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                          \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                          \"mobile\": \"11997098755\",\n                          \"cpf\": \"99999999999\",\n                          \"birthDate\": \"1956-01-03\"\n                        },\n                        \"address\": {\n                          \"zipcode\": \"13310600\",\n                          \"street\": \"Avenida Caetano Ruggieri\",\n                          \"number\": 259,\n                          \"district\": \"Parque das Rosas\",\n                          \"city\": \"Itu\",\n                          \"state\": \"SP\"\n                        },\n                        \"contact\": {\n                          \"name\": \"L\xFAcia Benedita Galv\xE3o\",\n                          \"email\": \"pesquisa@brunoeanaconsultoriafinanceirame.com.br\",\n                          \"mobile\": \"11997098755\"\n                        },\n                        \"bankAccount\": {\n                          \"bankAccountTypeId\": 1,\n                          \"bankId\": 120,\n                          \"agency\": \"1202\",\n                          \"account\": \"1066888\",\n                          \"digitAccount\": \"8\",\n                          \"holderTypeId\": \"2\"\n                        },\n                        \"commercialName\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"type\": 2,\n                        \"typeClass\": \"STO\",\n                        \"socialReason\": \"Bruno e Ana Consultoria Financeira ME\",\n                        \"documentNumber\": \"80017668000180\",\n                        \"cnaeId\": 656,\n                        \"foundationDate\": \"2019-01-05\",\n                        \"companyFormationCode\": \"04\",\n                        \"automaticAntecipation\": true,\n                        \"isTransactionsPix\": true\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      [\n                        {\n                          \"cnaeId\": 1,\n                          \"cnae\": \"7500-1/00\",\n                          \"description\": \"Servi\xE7os Veterin\xE1rios Sa\xFAde\",\n                          \"mccCode\": \"742\"\n                        }\n                      ]\n      - info:\n          name: Upload de documentos\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            EndPoint destinado ao upload de documentos para onboarding cliente. Cada documento deve ser enviado separadamente em uma requisi\xE7\xE3o.\n\n            Tipos de formatos de arquivos aceitos:\n\n            .jpg\n\n            ,png\n\n            ,jpeg\n\n            ,pdf\n\n            - \xC9 prefer\xEDvel que envie apenas como PDF, pois outros tipos podem n\xE3o ser aceitos durante o onboarding e poder\xE1 ser solicitado manualmente a troca dos docuemntos.\n                \n            - Mesmo que haja falha no envio dos documentos o retorno ser\xE1 200, pois o onboarding \xE9 ass\xEDncrono e ser\xE1 solicitado manualmente a troca dos documentos.\n                \n\n            ## Par\xE2metros da Requisi\xE7\xE3o\n\n            ### Estabelecimento\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio |\n            | --- | --- | --- | --- |\n            | RG | rg | RG do Representante (Obrigat\xF3rio quando CNH n\xE3o  <br>ao \xE9 enviada) | N\xE3o |\n            | CNH | cnh | CNH do Representante (Obrigat\xF3rio quando RG n\xE3o  <br>ao \xE9 enviado) | N\xE3o |\n            | CNPJ | cnpj | Cart\xE3o CNPJ da empresa quando aplic\xE1vel | N\xE3o |\n            | COMPROVANTE DE ENDERE\xC7O | proof_of_address | Comprovante de endere\xE7o do representante da empresa | Sim |\n            | CONTRATO SOCIAL | social_contract | Contrato Sicial da empresa quando aplic\xE1vel | N\xE3o |\n            | SELFIE COM DOCUMENTO | selfie | Selfie do Representante da empresa segurando o documento de identifica\xE7\xE3o | Sim |\n          type: text/markdown\n        items:\n          - info:\n              name: Upload de Documentos\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL_PRODUCTION}}/app/api/companies/upload-document/:companyid/type/:type_document'\n              headers:\n                - name: Authorization\n                  value: Bearer <access_token>\n              params:\n                - name: companyid\n                  value: ''\n                  type: path\n                - name: type_document\n                  value: ''\n                  type: path\n              body:\n                type: multipart-form\n                data:\n                  - name: document\n                    type: file\n                    value:\n                      - ''\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL_PRODUCTION}}/app/api/companies/upload-document/:companyid/type/:type_document'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: companyid\n                      value: '23'\n                      type: path\n                    - name: type_document\n                      value: proof_of_address\n                      type: path\n                  body:\n                    type: multipart-form\n                    data:\n                      - name: document\n                        type: file\n                        value:\n                          - /home/tothus/Imagens/proof_of_address.pdf\n                response:\n                  status: .nan\n                  statusText: '201'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"message\": \"Voc\xEA fez upload do documento com sucesso!\"\n                      }\n              - name: Falha na requisi\xE7\xE3o\n                request:\n                  url: '{{URL_PRODUCTION}}/app/api/companies/upload-document/:companyid/type/:type_document'\n                  method: POST\n                  headers:\n                    - name: Authorization\n                      value: Bearer <access_token>\n                    - name: Content-Type\n                      value: application/json\n                  params:\n                    - name: companyid\n                      value: '23'\n                      type: path\n                    - name: type_document\n                      value: proof_of_address\n                      type: path\n                  body:\n                    type: multipart-form\n                    data:\n                      - name: document\n                        type: file\n                        value:\n                          - /home/tothus/Imagens/proof_of_address.pdf\n                response:\n                  status: .nan\n                  statusText: '201'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"message\": \"Ocorreu um erro ao fazer o upload do documento\"\n                      }\n  - info:\n      name: Link de Pagamento\n      type: folder\n      seq: 5\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Criar Link de Pagamento\n          type: folder\n          seq: 2\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Este endpoint \xE9 destinada a cria\xE7\xE3o de link's de pagamento padr\xE3o da plataforma com checkout de pagamento para o cliente pagar atrav\xE9s de Pix ou Cart\xE3o de Cr\xE9dito.\n\n            ## Body Parameters\n\n            ### Geral\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **amount** | int32 | Valor do pagamento em centavos sem v\xEDrgula e ponto. (Max 9999999999). | Sim | \\- |\n            | **currency** | string | Moeda na qual o link de pagamento ser\xE1 criado. Valores permitidos: `BRL`, `USD`. | N\xE3o | BRL |\n            | **maxNumberOfInstallments** | int32 | N\xFAmero m\xE1ximo de parcelas que o comprador pode selecionar. (Max 12x). | Sim | \\- |\n            | **maxInstallmentsNoInterest** | int32 | Quantidade de parcelas sem juros. (Max 12x). | N\xE3o | \\- |\n            | **expiredLink** | date | Data de expira\xE7\xE3o do link de pagamento. | N\xE3o | \\- |\n            | **nameCheckout** | string | Nome do link de pagamento. (Max 255 caracteres). | N\xE3o | \\- |\n            | **descriptionCheckout** | string | Descri\xE7\xE3o do link de pagamento. | N\xE3o | \\- |\n            | **dueDateLink** | date | Data de vencimento do link de pagamento. Caso os atributos `interestRateVariable` e `interestRateFixed` estejam preenchidos, este campo \xE9 obrigat\xF3rio. | N\xE3o | \\- |\n            | **interestRateVariable** | int32 | Taxa de juros vari\xE1vel cobradas m\xEAs a m\xEAs ap\xF3s a data de vencimento. Obrigat\xF3rio preencher propriedade `dueDateLink` ao enviar valores nesta propriedade. (Max 99999). | N\xE3o | \\- |\n            | **interestRateFixed** | int32 | Valor de multa fixa caso a data de vencimento seja superada. Sem v\xEDrgula e ponto. Obrigat\xF3rio preencher propriedade `dueDateLink` ao enviar valores nesta propriedade. | N\xE3o | \\- |\n            | **redirectUrl** | string | URL para redirecionamento do comprador ap\xF3s a finaliza\xE7\xE3o do pagamento (Max 255 caracteres). Exemplo: `https://ultrapayments.com.br`. | N\xE3o | \\- |\n            | **customer** | Customer | Informa\xE7\xF5es do cliente que receber\xE1 o link de pagamento. | Sim | \\- |\n            | **splits** | Splits\\[\\] | Split do Pagamento. | N\xE3o | \\- |\n            | **metadata** | Metadata | O par\xE2metro metadata permite que os usu\xE1rios anexem informa\xE7\xF5es adicionais a uma transa\xE7\xE3o. Isso pode incluir qualquer par de chave-valor que forne\xE7a contexto ou detalhes adicionais sobre a transa\xE7\xE3o. O metadata n\xE3o \xE9 utilizado pela API para processar a transa\xE7\xE3o, mas pode ser \xFAtil para o registro do usu\xE1rio ou para a integra\xE7\xE3o com outros sistemas. | N\xE3o | \\- |\n            | **discountType** | string | Determina o tipo do desconto. | N\xE3o | \\- |\n            | **discount** | int32 | Valor do desconto. Para `PERCENTAGE`, aplica-se como percentual. Para `AMOUNT`, aplica-se como valor fixo. | N\xE3o | \\- |\n\n            ### Customer\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **name** | string | Nome completo do cliente que receber\xE1 o link de pagamento. (Max 150 caracteres). | Sim | \\- |\n            | **email** | string | Email do cliente que receber\xE1 o link de pagamento. (Max 255 caracteres). | Sim | \\- |\n            | **mobile** | string | Celular do cliente que receber\xE1 o link de pagamento. (Max 11 caracteres). | N\xE3o | \\- |\n            | **birthDate** | date | Data de nascimento do cliente que receber\xE1 o link de pagamento. | N\xE3o | \\- |\n            | **documentNumber** | string | N\xFAmero CPF/CNPJ do cliente que receber\xE1 o link de pagamento. (Max 14 caracteres). | Sim | \\- |\n            | **address** | Address | Endere\xE7o do cliente que receber\xE1 o link de pagamento. | N\xE3o | \\- |\n\n            ### Address\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **zipcode** | string | CEP do endere\xE7o. | N\xE3o | \\- |\n            | **street** | string | Logradouro do endere\xE7o. | N\xE3o | \\- |\n            | **number** | string | N\xFAmero do endere\xE7o. | N\xE3o | \\- |\n            | **complement** | string | Complemento do endere\xE7o. | N\xE3o | \\- |\n            | **district** | string | Bairro do endere\xE7o. | N\xE3o | \\- |\n            | **city** | string | Cidade do endere\xE7o. | N\xE3o | \\- |\n            | **state** | string | Estado do endere\xE7o (sigla). | N\xE3o | \\- |\n            | **country** | string | Pa\xEDs do endere\xE7o. Defaults to `BRA`. | N\xE3o | BRA |\n\n            ### Splits\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **recipientToken** | string | Token do Estabelecimento. | Sim | \\- |\n            | **merchantType** | string | Tipo de participante do pagamento. Valores poss\xEDveis: `PRIMARY`, `SECONDARY`. | Sim | \\- |\n            | **type** | string | Define a divis\xE3o do valor do split de maneira fixa ou percentual. Valores poss\xEDveis: `PERCENTAGE`, `AMOUNT`. | Sim | \\- |\n            | **chargeFee** | boolean | Define se o participante \xE9 o pagador da taxa do pagamento. Defaults to `false`. | Sim | false |\n            | **amountSplit** | float | Valor do split destinado ao participante. Para valores fixos, em centavos. Para percentuais, de 0 a 100. | Sim | \\- |\n\n            ### Metadata\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **key** | string | Chave personalizada do metadado. | N\xE3o | \\- |\n            | **value** | string | Valor correspondente ao metadado. | N\xE3o | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Criar Link de Pagamento\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/payment_links/create'\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            examples:\n              - name: Sucesso\n                request:\n                  url: '{{URL}}app/api/payment_links/create'\n                  method: POST\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"amount\": 0,\n                        \"currency\": \"BRL\",\n                        \"maxNumberOfInstallments\": 0,\n                        \"maxInstallmentsNoInterest\": 0,\n                        \"expiredLink\": \"2024-12-28\",\n                        \"nameCheckout\": \"string\",\n                        \"descriptionCheckout\": \"string\",\n                        \"dueDateLink\": \"2024-12-28\",\n                        \"interestRateVariable\": 0,\n                        \"interestRateFixed\": 0,\n                        \"redirectUrl\": \"string\",\n                        \"customer\": {\n                          \"name\": \"string\",\n                          \"email\": \"string\",\n                          \"mobile\": \"string\",\n                          \"birthDate\": \"2024-12-28\",\n                          \"documentNumber\": \"string\",\n                          \"address\": {\n                            \"zipcode\": \"string\",\n                            \"street\": \"string\",\n                            \"number\": \"string\",\n                            \"complement\": \"string\",\n                            \"district\": \"string\",\n                            \"city\": \"string\",\n                            \"state\": \"string\",\n                            \"country\": \"BRA\"\n                          }\n                        },\n                        \"splits\": [\n                          {\n                            \"recipientToken\": \"string\",\n                            \"merchantType\": \"PRIMARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 0\n                          }\n                        ],\n                        \"metadata\": [\n                          {\n                            \"key\": \"string\",\n                            \"value\": \"string\"\n                          }\n                        ],\n                        \"discountType\": \"\\\"PERCENTAGE\\\"\",\n                        \"discount\": 0\n                      }\n                response:\n                  status: .nan\n                  statusText: '200'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                          \"id\": \"b566309d-a420-4ff9-be44-a32a374c07f1\",\n                          \"paymentUrl\": \"https://api.rakim.com.br/checkout/5d0028bb-7f8c-4b1e-8379-15aae8677c3d\",\n                          \"type\": \"payment_links\",\n                          \"amount\": 1035,\n                          \"discount\": 250,\n                          \"discountType\": \"AMOUNT\",\n                          \"maxNumberOfInstallments\": 1,\n                          \"currency\": \"BRL\",\n                          \"status\": \"pending\",\n                          \"nameCheckout\": null,\n                          \"descriptionCheckout\": null,\n                          \"redirectUrl\": null,\n                          \"dueDateLink\": null,\n                          \"expiredLink\": null,\n                          \"interestRateVariable\": 0,\n                          \"interestRateFixed\": 0,\n                          \"createdAt\": \"2022-02-01 00:00:01\",\n                          \"updatedAt\": \"2022-02-22 00:00:01\",\n                          \"customer\": {\n                              \"name\": \"Comprador Teste\",\n                              \"email\": \"example@test.com\",\n                              \"phone\": \"11999999999\",\n                              \"documentNumber\": \"99999999999\",\n                              \"birthDate\": \"1969-12-31\",\n                              \"createdAt\": \"2022-02-22 00:00:01\",\n                              \"updatedAt\": \"2022-02-22 00:00:01\"\n                          }\n                      }\n              - name: N\xE3o Autorizada\n                request:\n                  url: '{{URL}}app/api/payment_links/create'\n                  method: POST\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                    - name: Authorization\n                      value: Bearer <access_token>\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"amount\": 0,\n                        \"currency\": \"BRL\",\n                        \"maxNumberOfInstallments\": 0,\n                        \"maxInstallmentsNoInterest\": 0,\n                        \"expiredLink\": \"2024-12-28\",\n                        \"nameCheckout\": \"string\",\n                        \"descriptionCheckout\": \"string\",\n                        \"dueDateLink\": \"2024-12-28\",\n                        \"interestRateVariable\": 0,\n                        \"interestRateFixed\": 0,\n                        \"redirectUrl\": \"string\",\n                        \"customer\": {\n                          \"name\": \"string\",\n                          \"email\": \"string\",\n                          \"mobile\": \"string\",\n                          \"birthDate\": \"2024-12-28\",\n                          \"documentNumber\": \"string\",\n                          \"address\": {\n                            \"zipcode\": \"string\",\n                            \"street\": \"string\",\n                            \"number\": \"string\",\n                            \"complement\": \"string\",\n                            \"district\": \"string\",\n                            \"city\": \"string\",\n                            \"state\": \"string\",\n                            \"country\": \"BRA\"\n                          }\n                        },\n                        \"splits\": [\n                          {\n                            \"recipientToken\": \"string\",\n                            \"merchantType\": \"PRIMARY\",\n                            \"type\": \"PERCENTAGE\",\n                            \"chargeFee\": false,\n                            \"discountGrossAmount\": false,\n                            \"amountSplit\": 0\n                          }\n                        ],\n                        \"metadata\": [\n                          {\n                            \"key\": \"string\",\n                            \"value\": \"string\"\n                          }\n                        ],\n                        \"discountType\": \"\\\"PERCENTAGE\\\"\",\n                        \"discount\": 0\n                      }\n                response:\n                  status: .nan\n                  statusText: '401'\n                  headers:\n                    - name: Content-Type\n                      value: application/json\n                  body:\n                    type: json\n                    data: |-\n                      {\n                        \"message\": \"Token invalid\"\n                      }\n      - info:\n          name: Introdu\xE7\xE3o\n          type: folder\n          seq: 1\n        request:\n          auth: inherit\n        docs:\n          content: Essa \xE9 a sess\xE3o de introdu\xE7\xE3o ao escopo de **API de Link de Pagamento** oferecida pela nossa plataforma. Com ela voc\xEA pode criar de modo intuitivo, link's, contendo checkout e cobran\xE7a de um pagamento via API para os m\xE9todos de pagamento aceito pela sua loja, sejam eles Pix ou Cart\xE3o de Cr\xE9dito por meio do endpoint de [Cria\xE7\xE3o do Link de Pagamento](https://documenter.getpostman.com/view/40662984/2sAYJ6Bz2t#e5fe7e68-aa48-412a-84ef-ddff9d52e461).\n          type: text/markdown\n      - info:\n          name: Upload do Logo para Link de Pagamento\n          type: folder\n          seq: 3\n        request:\n          auth: inherit\n        docs:\n          content: |-\n            Este endpoint permite o upload de um logo personalizado para um Link de Pagamento espec\xEDfico, identificado pelo seu ID. A imagem enviada ser\xE1 armazenada e associada ao Link de Pagamento. Se for necess\xE1rio alterar a imagem do logo do Link de Pagamento, \xE9 necess\xE1rio fazer a requisi\xE7\xE3o novamente.\n\n            ## Body Parameters\n\n            ### Geral\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **image** | file | Arquivo de imagem que ser\xE1 utilizado como logo para o Link de Pagamento. A imagem precisa atender aos seguintes requisitos:  <br>  <br>\\- Extens\xF5es aceitas: `.png`, `.jpg`, `.jpeg`, `.gif`, `.svg`  <br>  <br>\\- Formato: Imagem `JPG`/`PNG`/`GIF`/`SVG`  <br>  <br>\\- Tamanho m\xE1ximo do arquivo: `2Mb`. | Sim | \\- |\n\n            ## Path Params\n\n            | Nome | Tipo | Descri\xE7\xE3o | Obrigat\xF3rio | Default |\n            | --- | --- | --- | --- | --- |\n            | **id** | string | Identificador \xFAnico do link de pagamento ao qual o logo ser\xE1 associado. | Sim | \\- |\n          type: text/markdown\n        items:\n          - info:\n              name: Upload logo\n              type: http\n              seq: 1\n            http:\n              method: POST\n              url: '{{URL}}app/api/payment_links/:id/upload'\n              params:\n                - name: id\n                  value: ''\n                  type: path\n
